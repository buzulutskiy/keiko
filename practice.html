<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b14">
<title>Практика — Кэйко</title>
<style>
  :root {
    --bg: #0d0b14;
    --ink: #f2eefb;
    --muted: #8f89a3;
    --dim: #5d5872;
    --gold: #ffc94d;
    --gold-2: #ff9d3f;
    --violet: #8b7cf6;
    --glass: rgba(255, 255, 255, 0.055);
    --glass-line: rgba(255, 255, 255, 0.09);
    --track: rgba(255, 255, 255, 0.09);
    --panel: rgba(28, 24, 38, 0.55);
    --ok: #6ee7a8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0 auto; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding: max(18px, env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
    max-width: 520px; -webkit-user-select: none; user-select: none;
  }
  .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; }
  .top h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
  .top span { color: var(--dim); font-size: 0.76rem; }

  .card {
    background: var(--panel); border: 1px solid var(--glass-line);
    border-radius: 18px; padding: 22px 20px;
  }
  .step-of { color: var(--dim); font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 14px; }

  .unit { text-align: center; margin: 4px 0 2px; }
  .unit b { display: block; font-size: 2.6rem; font-weight: 300; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .unit i { font-style: normal; display: block; color: var(--gold); font-size: 0.95rem; margin-top: 6px; }

  .say { text-align: center; font-size: 0.95rem; color: var(--muted); margin: 16px 0 4px; }
  .say b { color: var(--ink); font-weight: 600; }
  .lead { font-size: 1rem; line-height: 1.55; margin: 0 0 6px; }
  .lead + .lead { margin-top: 12px; }
  .lead b { font-weight: 600; }
  .dim { color: var(--muted); font-size: 0.88rem; }

  .pips { display: flex; gap: 10px; justify-content: center; margin: 18px 0 14px; }
  .pips i {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--glass-line);
    display: grid; place-items: center; font-style: normal; font-size: 0.95rem; color: var(--dim);
  }
  .pips i.on { background: var(--violet); border-color: transparent; color: #17122b; font-weight: 600; }

  .two { display: flex; gap: 10px; }
  .two button { flex: 1; border: 0; border-radius: 16px; padding: 17px 8px; font: inherit; font-size: 1rem; font-weight: 600; }
  .two .clean { background: linear-gradient(160deg, #7ff0b6, #4dd08c); color: #093021; }
  .two .miss { background: var(--glass); color: var(--ink); border: 1px solid var(--glass-line); }
  .big-btn.go { background: linear-gradient(160deg, #7ff0b6, #4dd08c); color: #093021; margin-top: 14px; }
  .say.dim2 { font-size: 0.88rem; line-height: 1.6; margin: 14px 0 0; }

  .big-btn {
    width: 100%; border: 0; border-radius: 16px; padding: 18px; font: inherit;
    font-size: 1.02rem; font-weight: 600; color: #241a05;
    background: linear-gradient(160deg, var(--gold), var(--gold-2)); margin-top: 6px;
  }
  .two-ghost { display: flex; gap: 8px; }
  .two-ghost .ghost { flex: 1; }
  .ghost {
    width: 100%; border: 1px solid var(--glass-line); background: transparent; color: var(--muted);
    font: inherit; font-size: 0.86rem; border-radius: 14px; padding: 12px; margin-top: 10px;
  }
  .choices { display: flex; flex-direction: column; gap: 9px; }
  .choices button {
    width: 100%; text-align: left; border: 1px solid var(--glass-line); background: var(--glass);
    color: var(--ink); font: inherit; font-size: 0.98rem; border-radius: 14px; padding: 14px 16px;
  }
  .choices button b { font-weight: 600; }
  .choices button em { font-style: normal; color: var(--dim); font-size: 0.78rem; display: block; margin-top: 1px; }
  .choices button.good { border-color: rgba(110, 231, 168, 0.42); }

  /* части пьесы */
  .parts { display: flex; gap: 5px; margin: 14px 0 6px; }
  .parts .p { flex: 1; text-align: center; }
  .parts .p i { display: block; height: 8px; border-radius: 3px; background: var(--track); margin-bottom: 5px; }
  .parts .p.done i { background: var(--ok); }
  .parts .p.now i { background: var(--gold); }
  .parts .p span { font-size: 0.65rem; color: var(--dim); }
  .parts .p.now span { color: var(--gold); }

  .ladder-cap { font-size: 0.82rem; color: var(--muted); margin: 16px 0 8px; }
  .ladder-cap b { color: var(--ink); font-weight: 600; }
  .ladder-note { font-size: 0.76rem; color: var(--dim); margin: 8px 0 0; }
  .ladder { display: flex; flex-direction: column; gap: 7px; margin: 4px 0 0; }
  .lvl { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; }
  .lvl b { min-width: 96px; font-weight: 600; }
  .lvl .track { flex: 1; height: 7px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .lvl .track i { display: block; height: 100%; background: var(--violet); }
  .lvl > span { color: var(--dim); min-width: 42px; text-align: right; font-variant-numeric: tabular-nums; }
  .lvl.now b { color: var(--gold); }
  .lvl.done b { color: var(--muted); }

  .hint-btn { margin-top: 14px; }
  .hint-box {
    margin-top: 10px; border-radius: 14px; padding: 14px 15px;
    background: rgba(139, 124, 246, 0.09);
    border: 1px solid rgba(139, 124, 246, 0.25);
    font-size: 0.9rem; line-height: 1.65;
  }
  .hb { padding: 7px 0; border-top: 1px solid rgba(255, 255, 255, 0.07); }
  .hb:first-child { border-top: 0; padding-top: 0; }
  .hn {
    display: inline-block; min-width: 30px; font-weight: 700;
    color: var(--gold); font-size: 0.82rem; font-variant-numeric: tabular-nums;
  }
  .hh { color: var(--dim); font-size: 0.78rem; font-weight: 600; }
  .hint-box b { font-weight: 600; color: var(--ink); }
  .hint-box i { font-style: normal; color: var(--gold-2); font-size: 0.8rem; }
  .hint-box .c {
    display: inline-block; background: rgba(255, 255, 255, 0.1); border-radius: 3px;
    padding: 0 5px; margin: 0 3px 0 5px; font-weight: 700; font-size: 0.74rem; color: var(--muted);
  }
  .hint-leg {
    margin: 12px 0 0; padding-top: 10px; font-size: 0.72rem; color: var(--dim);
    line-height: 1.55; border-top: 1px solid rgba(255, 255, 255, 0.07);
  }
  .list { margin: 14px 0 0; padding: 0; list-style: none; }
  .list li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--glass-line); font-size: 0.9rem; }
  .list li:first-child { border-top: 0; }
  .list li span { color: var(--muted); font-size: 0.84rem; text-align: right; }

  .why { margin-top: 16px; font-size: 0.78rem; color: var(--dim); line-height: 1.6; }
  .why b { color: var(--muted); font-weight: 600; }
  .note { font-size: 0.74rem; color: var(--dim); margin: 18px 2px 0; line-height: 1.55; text-align: center; }
</style>
</head>
<body>

<div class="top">
  <h1 id="pieceName">—</h1>
  <span id="sessionLine">—</span>
</div>

<div class="card" id="stage"></div>

<p class="note">Прототип. Живёт только в этом браузере, в приложение не попадает.</p>

<script>
/* ══════════ Пьеса ══════════ */
const PIECE = { name: "Бах — Прелюдия es-moll", bars: 40 };

/* ══════════ Система ══════════
   Пьеса режется на ЧАСТИ по восемь тактов, и каждая доводится до целого,
   прежде чем начнётся следующая. Это главное: сорок тактов, разобранных
   вширь по одному, не складываются ни во что — к тридцатому забудешь
   первый, и мелодии не услышишь ни разу. А часть из восьми тактов звучит
   уже на первом занятии.

   Внутри части — лесенка: по 1 такту → по 2 → по 4 → часть целиком.
   Единица разбора один такт (Chang: короткий отрезок можно пройти десятки
   раз за минуты; Fitch: «такт плюс одна нота»). Сращивание по 1-2-4 —
   у Fitch прямым текстом.

   Шов держится перекрытием: отрезок доигрывается до ПЕРВОЙ ноты
   следующего. У Chang это правило непрерывности, у Fitch — «такт плюс
   одна нота»; двое пришли к одному независимо.

   Готовность — три чистых подряд, сбился — счёт сначала (Fitch).
   Честно: исследования за числом «три» нет, это его правило.

   Руки порознь, потом вместе, но в одном занятии: Chang за долгую
   изоляцию рук, Fitch против. Взята середина. */
/* Части нарезаны по тому, как устроена сама пьеса, а не по восемь подряд:

   рука, начинаются длинные пробежки, наступает передышка. Взято из твоего
   же разбора; это не музыковедческий анализ фраз, и если по нотам видно

5</span><b>фа3</b> →¾ <span class=\"c\">5</span>быстро: <b>соль♭3 ля♭3 фа3 соль♭3 ля♭3</b>"},"33":{"r":"<span class=\"c\">1</span><b>до♭4<i>=си3</i>+фа4+ля♭4</b> →2сч <span class=\"c\">3</span>то же →2сч <span class=\"c\">5</span>то же →2сч","l":"<span class=\"c\">1</span><b>ре3♮</b> →2сч <span class=\"c\">3</span><b>ре3</b> →1сч <span class=\"c\">4</span>быстро: <b>ре3 ми♭3 ре3 до3♮</b> <span class=\"c\">5</span><b>ре3</b> →¾ <span class=\"c\">5</span>быстро: <b>ми♭3 фа3 ре3 ми♭3 фа3</b>"},"34":{"r":"<span class=\"c\">1</span><b>ре4♮+фа4+ля♭4</b> →2сч <span class=\"c\">3</span>то же →2сч <span class=\"c\">5</span>то же →2сч","l":"<span class=\"c\">1</span><b>до♭3<i>=си2</i></b> →2сч <span class=\"c\">3</span><b>до♭3<i>=си2</i></b> →1сч <span class=\"c\">4</span>быстро: <b>до♭3<i>=си2</i> ре♭3 до♭3<i>=си2</i> си♭2 до♭3<i>=си2</i> си♭2 ля♭2 си♭2 до♭3<i>=си2</i> ля♭2 си♭2 до♭3<i>=си2</i></b>"},"35":{"r":"<span class=\"c\">1</span><b>ре4♮+фа4+ля♭4+до♭5<i>=си4</i></b> →2сч <span class=\"c\">3</span>быстро: <b>до♭5<i>=си4</i> си♭4 ля♭4 соль♭4 фа4 ми♭4 ре4♮ фа4 ля♭4 до♭5<i>=си4</i> ре5♮ фа5 ля♭5 до♭6<i>=си5</i> си♭5 ре5</b>","l":"<span class=\"c\">1</span><b>ре2♮</b> →2сч"},"36":{"r":"<span class=\"c\">1</span><b>ми♭5</b> →1½ <span class=\"c\">2и</span><b>соль♭4+си♭4</b> <span class=\"c\">3</span>форшлаг <b>ля♭4</b>, <b>ми♭4+соль♭4</b> →2сч <span class=\"c\">5</span><b>ре4♮</b> →2сч + <b>фа4∿<i>(чередуй с соль♭4)</i></b> <span class=\"c\">5и</span><b>ми♭4</b> <span class=\"c\">6</span><b>фа4</b> →1сч","l":"<span class=\"c\">2и</span><b>ми♭2+ми♭3</b> <span class=\"c\">3</span><b>си♭2+ми♭3+соль♭3</b> →2сч <span class=\"c\">5</span><b>си♭2+фа3+ля♭3</b> →2сч"},"37":{"r":"<span class=\"c\">1</span><b>ми♭4</b> →2сч <span class=\"c\">3</span><b>ми♭4</b> →1сч <span class=\"c\">4</span>быстро: <b>ми♭4 фа4 соль4♮ ля♭4</b> <span class=\"c\">5</span><b>си♭4</b> →1сч <span class=\"c\">6</span>быстро: <b>си♭4 фа♭4<i>=ми4</i> ми♭4 ре♭4</b>","l":"<span class=\"c\">1</span>перекат <b>ми♭3→соль3♮→си♭3→ре♭4</b> →2сч <span class=\"c\">3</span>то же →2сч <span class=\"c\">5</span>то же →2сч"},"38":{"r":"<span class=\"c\">1</span><b>до♭4<i>=си3</i></b> →2сч <span class=\"c\">3</span><b>до♭4<i>=си3</i></b> →¾ <span class=\"c\">3</span>быстро: <b>ми♭4 фа4♮ соль4♮ ля♭4 си♭4</b> <span class=\"c\">5</span><b>до♭5<i>=си4</i></b> <span class=\"c\">5и</span>быстро: <b>до♭5<i>=си4</i> си♭4 ля♭4 соль♭4 фа4 соль♭4 ля♭4 фа4</b>","l":"<span class=\"c\">1</span><b>ми♭3+ля♭3</b> →2сч <span class=\"c\">3</span>то же →2сч <span class=\"c\">5</span>то же →2сч"},"39":{"r":"<span class=\"c\">1</span><b>ре4♮</b> →4сч <span class=\"c\">2и</span>быстро: <b>до♭4<i>=си3</i> си♭3</b> <span class=\"c\">3</span><b>до♭4<i>=си3</i></b> →1½ <span class=\"c\">5</span><b>ре4</b> →1½ <span class=\"c\">6и</span><b>ре4</b>","l":"<span class=\"c\">1</span><b>ми♭3+фа3</b> →2сч <span class=\"c\">3</span>то же →2сч <span class=\"c\">4и</span><b>ля♭3</b> <span class=\"c\">5</span>то же →2сч"},"40":{"r":"<span class=\"c\">1</span><b>ми♭4𝄐<i>(держи дольше)</i></b> →6сч","l":"<span class=\"c\">1</span><b>ми♭2𝄐<i>(держи дольше)</i>+си♭2+ми♭3+соль3♮+си♭3</b> →6сч"}};
const HINT_LEGEND = 'серая цифра — счёт (в такте шесть, между ними «и») · '
  + '→2сч держи два счёта, →1½ полтора, без пометки коротко · ∿ и tr — трель · '
  + 'перекат — ноты аккорда снизу вверх, не разом · =си2 — какую белую клавишу жать';

const PART_EDGES = [
  { from: 1,  to: 3,  why: "вступление, левая молчит" },
  { from: 4,  to: 8,  why: "вступает левая рука" },
  { from: 9,  to: 10, why: "правая одна, длинные пробежки" },
  { from: 11, to: 15, why: "самый плотный кусок" },
  { from: 16, to: 21, why: "после передышки" },
  { from: 22, to: 28, why: "спокойнее" },
  { from: 29, to: 35, why: "перед финалом" },
  { from: 36, to: 40, why: "финал" },
];
const REST_AT = 20, STOP_AT = 60, ASK_AGAIN = 12;
const REVIEW_N = 2;
const HAND = { left: "левая рука", right: "правая рука", both: "две руки" };
const bothOnly = (size) => size >= 4;  // с четырёх тактов руки уже соединены

const PARTS = PART_EDGES.map((p, i) => ({ i, ...p }));

/* Ступени внутри части: 1, 2, 4 такта и часть целиком. */
function stepsOf(p) {
  const len = p.to - p.from + 1;
  return [1, 2, 4, len].filter((s, i, a) => s <= len && a.indexOf(s) === i);
}
/* Ступени сборки: части сращиваются попарно, пока не выйдет вся пьеса. */
/* Сборка: части сращиваются попарно, пока не выйдет вся пьеса. */
const ASSEMBLY = (() => {
  let cur = PARTS.map((p) => ({ from: p.from, to: p.to }));
  const out = [];
  while (cur.length > 1) {
    const next = [];
    for (let i = 0; i < cur.length; i += 2)
      next.push(cur[i + 1] ? { from: cur[i].from, to: cur[i + 1].to } : cur[i]);
    out.push(next);
    cur = next;
  }
  return out;                      // [[пары], [четвёрки], …, [вся пьеса]]
})();

const sizeName = (s) =>
  s === 1 ? "по 1 такту" : s === PIECE.bars ? "вся пьеса" : "по " + s + " " + plural(s, "такту", "такта", "тактов");

function unitsIn(from, to, size) {
  const out = [];
  for (let f = from; f <= to; f += size) out.push({ from: f, to: Math.min(to, f + size - 1), size });
  return out;
}

const LS = "keiko-practice-v6";
const loadSt = () => { try { return JSON.parse(localStorage.getItem(LS)) || null; } catch { return null; } };
const save = () => { try { localStorage.setItem(LS, JSON.stringify(st)); } catch {} };

const fresh = () => ({
  session: 1, screen: "start",
  done: {}, cur: null, queue: [], closed: [], hintOpen: false, reviewed: [],
  startedAt: 0, breakMs: 0, restFrom: 0, restUntil: 0, askedAt: 0, backTo: "",
});
let st = loadSt() || fresh();

const $ = (s) => document.querySelector(s);
const el = (h) => { const d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstChild; };
function plural(n, a, b, c) {
  const m = n % 100, k = n % 10;
  return m >= 11 && m <= 14 ? c : k === 1 ? a : k >= 2 && k <= 4 ? b : c;
}
const today = () => new Date().toLocaleDateString("ru-RU", { day: "numeric", month: "long" });

const key = (u, hand) => u.size + ":" + u.from + "-" + u.to + ":" + hand;

/* Какие руки вообще звучат на этом отрезке. В начале прелюдии левая молчит
   три такта, и предлагать «такт 1, левая рука» было бы бессмыслицей.
   А если звучит одна рука, то и соединять нечего — проход «две руки» лишний. */
function handsFor(u) {
  let r = false, l = false;
  for (let b = u.from; b <= u.to; b++) {
    const h = HINTS[b];
    if (!h) { r = l = true; break; }        // нет данных — не гадаем, даём всё
    if (h.r) r = true;
    if (h.l) l = true;
  }
  if (r && !l) return ["right"];
  if (l && !r) return ["left"];
  if (!r && !l) return [];
  return bothOnly(u.size) ? ["both"] : ["left", "right", "both"];
}
const isDone = (u, hand) => !!st.done[key(u, hand)];
const unitDone = (u) => handsFor(u).every((h) => isDone(u, h));
const stepDone = (p, size) => unitsIn(p.from, p.to, size).every(unitDone);
const partDone = (p) => stepsOf(p).every((s) => stepDone(p, s));

/* Где мы сейчас: первая недоделанная часть, а в ней — первая недоделанная
   ступень. Части идут по очереди: следующая не начинается, пока предыдущая
   не зазвучит целиком. */
const asUnit = (sp) => ({ from: sp.from, to: sp.to, size: sp.to - sp.from + 1 });

function where() {
  for (const p of PARTS) {
    if (partDone(p)) continue;
    for (const size of stepsOf(p)) if (!stepDone(p, size)) return { part: p, size };
  }
  for (let li = 0; li < ASSEMBLY.length; li++)
    if (!ASSEMBLY[li].map(asUnit).every(unitDone)) return { part: null, assembly: li };
  return { part: null, assembly: ASSEMBLY.length - 1, finished: true };
}

function buildQueue() {
  const w = where();
  const q = [];

  /* Освежённое за это занятие в очередь больше не возвращается: оно нигде
     не помечается «пройденным», и без этого списка очередь пересобиралась бы
     на те же два отрезка бесконечно. */
  /* Освежаем только в начале занятия: очередь пересобирается на каждой
     ступени, и без этого предела разминка лезла бы через раз до конца дня. */
  (st.reviewed.length >= REVIEW_N ? [] : Object.entries(st.done))
    .filter(([k]) => !st.reviewed.includes(k))
    .sort((a, b) => a[1] - b[1])
    .slice(0, REVIEW_N)
    .forEach(([k]) => {
      const [size, span, hand] = k.split(":");
      const [from, to] = span.split("-").map(Number);
      q.push({ from, to, size: +size, hand, review: true, k });
    });

  const us = w.part ? unitsIn(w.part.from, w.part.to, w.size) : ASSEMBLY[w.assembly].map(asUnit);
  for (const u of us)
    for (const h of handsFor(u))
      if (!isDone(u, h)) q.push({ from: u.from, to: u.to, size: u.size, hand: h });

  return q;
}

const elapsedMin = () => st.startedAt ? (Date.now() - st.startedAt - st.breakMs) / 60000 : 0;
function watchClock() {
  if (!st.startedAt || ["break", "resting", "wrap", "end", "start"].includes(st.screen)) return;
  const m = elapsedMin();
  if (m >= STOP_AT && m - st.askedAt >= ASK_AGAIN) { st.askedAt = m; st.backTo = st.screen; st.screen = "wrap"; render(); return; }
  if (m >= REST_AT && m - st.askedAt >= ASK_AGAIN) { st.askedAt = m; st.backTo = st.screen; st.screen = "break"; render(); }
}
setInterval(watchClock, 5000);

let restTimer = 0;
function paintRest() {
  clearInterval(restTimer);
  if (st.screen !== "resting") return;
  const draw = () => {
    const left = Math.max(0, st.restUntil - Date.now());
    const e = $("#restLeft");
    if (!e) return;
    e.textContent = Math.floor(left / 60000) + ":" + String(Math.floor(left / 1000) % 60).padStart(2, "0");
    if (left <= 0) { clearInterval(restTimer); endRest(); }
  };
  draw();
  restTimer = setInterval(draw, 250);
}
function endRest() {
  if (st.restFrom) st.breakMs += Date.now() - st.restFrom;
  st.restFrom = 0; st.restUntil = 0;
  st.askedAt = elapsedMin();
  st.screen = st.backTo || "work";
  render();
}

/* ══════════ Отрисовка ══════════ */
function partsHTML() {
  const w = where();
  return '<div class="parts">' + PARTS.map((p) => {
    const cls = partDone(p) ? "done" : (w.part && w.part.i === p.i ? "now" : "");
    return `<div class="p ${cls}"><i></i><span>${p.from}–${p.to}</span></div>`;
  }).join("") + "</div>";
}

function ladderHTML() {
  const w = where();
  if (!w.part) {
    return `<p class="ladder-cap">Все части зазвучали — <b>собираем пьесу</b></p>`
      + '<div class="ladder">' + ASSEMBLY.map((level, li) => {
        const us = level.map(asUnit);
        const d = us.filter(unitDone).length;
        const name = us.length === 1 ? "вся пьеса" : "по " + us.length + " " + plural(us.length, "куску", "куска", "кусков");
        return `<div class="lvl ${li === w.assembly ? "now" : d === us.length ? "done" : ""}">
          <b>${name}</b>
          <span class="track"><i style="width:${Math.round(d / us.length * 100)}%"></i></span>
          <span>${d}/${us.length}</span></div>`;
      }).join("") + "</div>";
  }
  const p = w.part;
  return `<p class="ladder-cap">Часть ${p.i + 1} из ${PARTS.length} — <b>такты ${p.from}–${p.to}</b><br>
      <span style="color:var(--dim)">${p.why}</span></p>`
    + '<div class="ladder">' + stepsOf(p).map((size) => {
      const us = unitsIn(p.from, p.to, size);
      const d = us.filter(unitDone).length;
      const name = size === p.to - p.from + 1 ? "часть целиком" : sizeName(size);
      return `<div class="lvl ${size === w.size ? "now" : d === us.length ? "done" : ""}">
        <b>${name}</b>
        <span class="track"><i style="width:${Math.round(d / us.length * 100)}%"></i></span>
        <span>${d}/${us.length}</span></div>`;
    }).join("") + "</div>"
    + `<p class="ladder-note">Часть доводится до целого, и только потом начинается следующая.</p>`;
}

const spanText = (u) => u.from === u.to ? "такт " + u.from : "такты " + u.from + "–" + u.to;

/* Показываем только ту руку, которой сейчас занимаемся: на разборе левой
   правая строка — лишний шум. */
function hintHTML(u) {
  const rows = [];
  for (let b = u.from; b <= u.to; b++) {
    const h = HINTS[b];
    if (!h) continue;
    const want = u.hand === "both" ? ["r", "l"] : u.hand === "left" ? ["l"] : ["r"];
    const parts = want
      .filter((k) => h[k])
      .map((k) => `<span class="hh">${k === "r" ? "пр." : "лев."}</span> ${h[k]}`);
    rows.push(`<div class="hb"><span class="hn">Т${b}</span>${parts.length
      ? parts.join("<br>")
      : '<span class="hh">молчит</span>'}</div>`);
  }
  return `<div class="hint-box">${rows.join("")}<p class="hint-leg">${HINT_LEGEND}</p></div>`;
}

function render() {
  $("#pieceName").textContent = PIECE.name;
  const m = Math.floor(elapsedMin());
  $("#sessionLine").textContent = today() + " · занятие " + st.session + (st.startedAt ? " · " + m + " мин" : "");
  const box = $("#stage");
  box.innerHTML = "";
  box.appendChild(SCREENS[st.screen]());
  paintRest();
  save();
}

const SCREENS = {

  start: () => {
    const w = where();
    return el(`
      <div>
        <p class="step-of">Занятие ${st.session}</p>
        ${st.session === 1
          ? `<p class="lead">Начинаем с нуля: <b>такт первый, левая рука</b>.</p>
             <p class="lead dim">Пьеса разрезана на ${PARTS.length} ${plural(PARTS.length, "часть", "части", "частей")}
               по тому, как она устроена: границы там, где меняется фактура. Первая часть
               доводится до того, чтобы зазвучать целиком, и только потом начинается вторая —
               так мелодия появляется уже сегодня, а не через сорок тактов.</p>`
          : `<p class="lead">Продолжаем.</p>
             <p class="lead dim">Сначала освежим давнее, потом дальше по плану.</p>`}
        ${partsHTML()}
        ${ladderHTML()}
        <button class="big-btn" id="begin">${st.session === 1 ? "Начать занятие" : "Продолжить занятие"}</button>
      </div>`);
  },

  work: () => {
    const u = st.cur;
    const next = u.to < PIECE.bars ? u.to + 1 : 0;
    const part = PARTS.find((p) => p.from === u.from && p.to === u.to);
    const whole = !!part && !u.review;
    return el(`
      <div>
        <p class="step-of">${u.review ? "Освежаем" : "Разбираем"}</p>
        <div class="unit"><b>${spanText(u)}</b><i>${HAND[u.hand]}</i></div>
        <p class="say">${next
          ? `Доиграй до <b>первой ноты такта ${next}</b> и остановись.`
          : "Доиграй до конца."}</p>
        <p class="say dim2">Играй, пока не пойдёт <b>три раза подряд без запинки</b>.
          Сбился — считай сначала.</p>
        <button class="big-btn go" id="clean">Получилось, дальше</button>
        <button class="ghost hint-btn" id="hint">${st.hintOpen ? "Спрятать подсказку" : "Подсказка: как читаются ноты"}</button>
        ${st.hintOpen ? hintHTML(u) : ""}
        <div class="two-ghost">
          <button class="ghost" id="skip">Отложить этот отрезок</button>
          <button class="ghost" id="finish">Завершить занятие</button>
        </div>
        <p class="why">${whole
          ? "<b>Это целый кусок.</b> Здесь уже слышно мелодию — ради этого и режем пьесу на части."
          : "<b>Зачем до первой ноты следующего такта.</b> С этой ноты начнётся следующий отрезок — так соседние куски потом склеятся сами."}</p>
      </div>`);
  },

  break: () => el(`
    <div>
      <p class="step-of">Передышка</p>
      <p class="lead">За инструментом <b>${Math.floor(elapsedMin())} ${plural(Math.floor(elapsedMin()), "минута", "минуты", "минут")}</b>.</p>
      <p class="lead dim">Около двадцати минут держится внимание, дальше занятие идёт вхолостую.</p>
      <div class="choices">
        <button class="good" data-rest="5"><b>Перерыв 5 минут</b></button>
        <button data-rest="10"><b>Перерыв 10 минут</b></button>
        <button data-rest="0"><b>Ещё поиграю</b><em>напомню через ${ASK_AGAIN} минут</em></button>
      </div>
    </div>`),

  resting: () => el(`
    <div>
      <p class="step-of">Перерыв</p>
      <div class="unit"><b id="restLeft">—</b><i>осталось</i></div>
      <p class="lead dim" style="text-align:center">Встань, разомни кисти, посмотри в окно.</p>
      <button class="big-btn" id="restDone">Готов, продолжаем</button>
    </div>`),

  wrap: () => el(`
    <div>
      <p class="step-of">Пора закругляться</p>
      <p class="lead">Занятие идёт <b>${Math.floor(elapsedMin())} ${plural(Math.floor(elapsedMin()), "минуту", "минуты", "минут")}</b>.</p>
      <p class="lead dim">Незакрытое не пропадёт — перенесётся на следующий раз. Точность прибавляет
        после сна, а не к концу длинного занятия.</p>
      <div class="choices">
        <button class="good" id="finish"><b>Завершить занятие</b></button>
        <button data-rest="0"><b>Ещё немного</b><em>спрошу снова через ${ASK_AGAIN} минут</em></button>
      </div>
    </div>`),

  end: () => {
    const w = where();
    return el(`
      <div>
        <p class="step-of">Занятие ${st.session} окончено</p>
        <p class="lead">${st.closed.length
          ? `Закрыто: <b>${st.closed.length}</b> ${plural(st.closed.length, "отрезок", "отрезка", "отрезков")}.`
          : "Сегодня ничего не закрылось — бывает."}</p>
        ${st.queue.length ? `<p class="lead dim">Осталось ${st.queue.length} — перенёс на следующее занятие.</p>` : ""}
        ${partsHTML()}
        ${ladderHTML()}
        <ul class="list">
          <li>За инструментом<span>${Math.floor(elapsedMin())} мин</span></li>
          <li>Готовых частей<span>${PARTS.filter(partDone).length} из ${PARTS.length}</span></li>
        </ul>
        <p class="why"><b>До следующего раза.</b> Лучше вернуться завтра, чем добивать сегодня:
          точность после ночи прибавляет сама.</p>
        <button class="big-btn" id="next">Следующее занятие</button>
        <button class="ghost" id="reset">Начать пьесу заново</button>
      </div>`);
  },
};

/* Очередь — это план на текущую ступень, а не на всё занятие. Кончилась —
   собираем следующую и идём дальше; занятие кончается по часам или по кнопке,
   а не потому, что доделали восемь тактов. */
function takeNext() {
  if (!st.queue.length) st.queue = buildQueue();
  st.cur = st.queue.shift() || null;
  st.screen = st.cur ? "work" : "end";
  render();
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;

  if (t.id === "begin") {
    st.startedAt = st.startedAt || Date.now();
    st.queue = buildQueue();
    st.closed = [];
    return takeNext();
  }

  if (t.id === "clean") {
    const u = st.cur;
    if (u.review) st.reviewed.push(u.k);
    else {
      st.done[key(u, u.hand)] = st.session;
      st.closed.push(spanText(u) + " · " + HAND[u.hand]);
    }
    /* Ступень или часть могли сомкнуться — тогда очередь уже про прошлое,
       и её надо пересобрать под новое место. */
    const w = where();
    const nextNew = st.queue.find((x) => !x.review);
    if (nextNew && nextNew.size !== w.size) st.queue = buildQueue();
    return takeNext();
  }

  if (t.id === "hint") { st.hintOpen = !st.hintOpen; return render(); }
  if (t.id === "skip") {
    if (st.cur.review) st.reviewed.push(st.cur.k);   // отложенное освежение не крутим по кругу
    else st.queue.push(st.cur);
    return takeNext();
  }

  if (t.dataset.rest !== undefined) {
    const min = +t.dataset.rest;
    if (min) { st.restFrom = Date.now(); st.restUntil = st.restFrom + min * 60000; st.screen = "resting"; }
    else st.screen = st.backTo || "work";
    return render();
  }
  if (t.id === "restDone") return endRest();
  if (t.id === "finish") { st.screen = "end"; return render(); }

  if (t.id === "next") {
    const n = st.session + 1, done = st.done;
    st = fresh();
    st.session = n;
    st.done = done;
    return render();
  }

  if (t.id === "reset") {
    if (!confirm("Забыть весь разбор и начать пьесу с первого такта?")) return;
    st = fresh();
    return render();
  }
});

render();
</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b14">
  <title>Кэйко</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0b14;
      --card: rgba(255, 255, 255, 0.045);
      --card-2: rgba(255, 255, 255, 0.075);
      --line: rgba(255, 255, 255, 0.08);
      --ink: #f2eefb;
      --muted: #8f89a3;
      --dim: #5d5872;
      --gold: #ffc94d;
      --gold-2: #ff9d3f;
      --violet: #8b7cf6;
      --green: #4ade80;
      --red: #f87171;

      /* стеклянные поверхности — тема их переопределяет */
      --glass: rgba(255, 255, 255, 0.055);
      --glass-2: rgba(255, 255, 255, 0.09);
      --glass-line: rgba(255, 255, 255, 0.09);
      --glass-hi: rgba(255, 255, 255, 0.07);
      --track: rgba(255, 255, 255, 0.09);
      --panel: rgba(28, 24, 38, 0.55);
      --bar: rgba(20, 17, 28, 0.72);
      --sheet: rgba(26, 22, 36, 0.82);
      --sheet-solid: rgba(26, 22, 36, 0.92);
      --shadow: rgba(0, 0, 0, 0.35);
    }

    :root { --safe-b: env(safe-area-inset-bottom, 0px); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { touch-action: manipulation; }            /* двойной тап больше не приближает */
    body {
      touch-action: manipulation;
      overscroll-behavior: none;                     /* и не оттягивается за край, как страница */
      -webkit-user-select: none; user-select: none;  /* интерфейс не выделяется, как в родном приложении */
    }
    /* а вот тексты, которые хочется скопировать, выделяются как обычно */
    .post-text, .th-name, .th-when, .lf-review, .cheer-item, .dig-item, #cheerText,
    .note-input, input, textarea, select {
      -webkit-user-select: text; user-select: text;
      -webkit-touch-callout: default;                /* системное меню поля: «Вставить», «Отсканировать текст» */
    }
    button, .tabbar, .slot, .cover { -webkit-touch-callout: none; }
    html, body { margin: 0; }
    html { height: 100%; }

    body {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: ui-rounded, -apple-system, "SF Pro Rounded", system-ui, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    /* подложка перекрашивается под обложку активного материала */
    .bgfx { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
    .bgfx i {
      position: absolute; inset: 0;
      opacity: 0;
      transition: opacity 0.65s ease;
    }
    .bgfx i.on { opacity: 1; }
    /* Волны под музыку. Канва нарочно крошечная и растянута на экран:
       мягкость получается от растяжения, а не от дорогого фильтра. */
    /* Канва выходит за края экрана: blur гасит собственные границы элемента,
       и на экране это читалось как светлая полоса с ровным краем. */
    #bgWave {
      position: absolute; top: -80px; left: -80px;
      width: calc(100% + 160px); height: calc(100% + 160px);
      filter: blur(18px) saturate(1.25);
      opacity: 0; transition: opacity 1.2s ease;
    }
    #bgWave.on { opacity: 0.95; }
    @media (prefers-reduced-motion: reduce) { #bgWave { display: none; } }

    /* ── Погружение: постоял, слушаешь — лишнее уходит, остаётся обложка ── */
    /* !important нужен: у этих блоков есть анимации появления, они перебивают */
    body.zen header,
    body.zen #banner,
    body.zen .tabbar,
    body.zen .hero-title,
    body.zen .cta,
    body.zen .nudge,
    body.zen .fabs,
    body.zen .to-top { opacity: 0 !important; pointer-events: none !important; }
    body.zen .ring-wrap { opacity: 0.22 !important; transform: scale(0.96); }
    /* соседние обложки не прячем совсем — они «утоплены», это и даёт глубину */
    body.zen .slot:not(.on) { opacity: 0.14; transform: scale(0.78); }
    body.zen .slot.on { transform: scale(1.06); }
    body.zen #bgWave.on { opacity: 0.95; }

    header, #banner, .tabbar, .hero-title, .cta, .nudge, .fabs, .to-top {
      transition: opacity 1.4s ease !important;
    }
    .ring-wrap { transition: opacity 1.4s ease, transform 1.4s cubic-bezier(0.22, 1, 0.36, 1); }
    #bgWave { transition: opacity 1.4s ease; }
    body.zen { cursor: none; }

    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; padding: 0; }

    .app {
      width: min(460px, 100%);
      margin: 0 auto;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: max(12px, env(safe-area-inset-top)) 16px var(--tab-h, 72px);
    }

    /* область контента: главная — без скролла, остальные — со своим скроллом */
    #view { flex: 1; min-height: 0; }
    #view.scrolls { overflow-y: auto; padding-bottom: 14px; }
    #view.fixed { overflow: hidden; }

    /* ── Шапка ─────────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 2px 2px 10px;
      flex-shrink: 0;
    }
    .logo {
      font-size: 1.25rem; font-weight: 800; margin-right: auto;
      display: inline-flex; align-items: baseline; gap: 7px;
    }
    .logo i { font-style: normal; font-size: 0.8rem; color: var(--dim); font-weight: 600; }
    .logo em {
      font-style: normal;
      background: linear-gradient(120deg, var(--gold), var(--gold-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #4b4661; }
    .sync-dot.ok { background: var(--green); }
    .sync-dot.busy { background: var(--gold); animation: pulse 1s infinite; }
    .sync-dot.err { background: var(--red); }
    .sync-dot.off { background: var(--dim); box-shadow: 0 0 0 2px rgba(255,255,255,0.06); }
    @keyframes pulse { 50% { opacity: 0.3; } }
    .gear {
      width: 36px; height: 36px; border-radius: 12px;
      background: var(--glass-2);
      backdrop-filter: blur(16px) saturate(1.4);
      -webkit-backdrop-filter: blur(16px) saturate(1.4);
      border: 1px solid var(--glass-line);
      display: grid; place-items: center; font-size: 0.95rem;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s;
    }
    .gear:active { transform: scale(0.92); background: var(--glass-2); }

    /* ── Сегмент-переключатель хобби ───── */
    .seg {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;   /* кнопки делят всю ширину, сколько бы их ни было */
      gap: 4px;
      background: var(--glass);
      backdrop-filter: blur(14px) saturate(1.3);
      -webkit-backdrop-filter: blur(14px) saturate(1.3);
      border: 1px solid var(--glass-line);
      border-radius: 16px;
      padding: 4px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .seg button {
      min-height: 40px;
      border-radius: 11px;
      font-weight: 700;
      font-size: 0.86rem;
      color: var(--muted);
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      transition: background 0.2s, color 0.2s;
    }
    .seg button.on {
      background: var(--glass-2);
      color: var(--ink);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 4px 14px rgba(0, 0, 0, 0.3);
    }

    /* цель недели, пауза, история, архив */
    .chip.goal-done { border-color: rgba(74, 222, 128, 0.45); background: rgba(74, 222, 128, 0.12); color: var(--ink); }

    .freeze {
      background: var(--card-2);
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 12px 13px;
      margin-top: 12px;
      display: grid; gap: 10px;
    }
    .fz-head { font-size: 0.84rem; color: var(--muted); line-height: 1.4; }
    .fz-head b { color: var(--ink); }
    .fz-form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 7px; align-items: center; }
    .fz-form .note-input { margin-top: 0; min-height: 42px; font-size: 16px; }
    .fz-form .btn { min-height: 42px; width: auto; padding: 0 14px; font-size: 0.85rem; }
    .fz-form2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .fz-form2 .btn { min-height: 44px; font-size: 0.84rem; }
    /* снимки в архиве копий */
    .arc-row {
      display: block; width: 100%; text-align: left;
      margin-top: 6px; padding: 10px 12px;
      border-radius: 12px;
      background: var(--glass); border: 1px solid var(--glass-line);
    }
    .arc-row b { display: block; font-size: 0.86rem; font-weight: 700; color: var(--ink); }
    .arc-row em { font-style: normal; font-size: 0.74rem; color: var(--dim); }

    .fz-list { display: grid; gap: 6px; }
    .fz-item {
      display: flex; align-items: center; gap: 10px;
      font-size: 0.84rem; color: var(--muted);
      background: rgba(255, 255, 255, 0.04);
      border-radius: 10px; padding: 8px 10px;
    }
    .fz-item.now { color: var(--gold); background: rgba(255, 201, 77, 0.12); }
    .fz-item button { margin-left: auto; color: var(--dim); font-size: 0.95rem; padding: 0 4px; }
    .fz-empty { font-size: 0.8rem; color: var(--dim); }
    .fz-empty b { color: var(--muted); }

    .goal-pick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .gbtn {
      min-height: 40px; border-radius: 11px;
      background: var(--glass);
      color: var(--muted); font-weight: 800;
    }
    .gbtn.on { background: linear-gradient(140deg, var(--gold), var(--gold-2)); color: #241a05; }

    .hist { display: flex; align-items: flex-end; gap: 4px; height: 92px; }
    .hb { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; gap: 4px; }
    .hb i {
      display: block; width: 100%; min-height: 3px;
      border-radius: 4px 4px 2px 2px;
      background: linear-gradient(180deg, var(--gold), var(--gold-2));
      opacity: 0.85;
    }
    .hb span { font-size: 0.6rem; color: var(--dim); text-align: center; height: 12px; }
    .hist-note { margin-top: 10px; font-size: 0.8rem; color: var(--muted); text-align: center; }
    .hist-note b { color: var(--ink); }

    .material-panel .mat-row {
      display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px;
    }
    .mat-name { font-size: 0.94rem; font-weight: 700; line-height: 1.25; }
    .mat-name i { display: block; font-style: normal; font-size: 0.78rem; color: var(--dim); font-weight: 500; margin-top: 3px; }
    .mat-pct { margin-left: auto; font-weight: 850; color: var(--gold); }

    .week-cmp { margin-top: 10px; font-size: 0.78rem; color: var(--dim); text-align: center; }
    .stat b i { font-style: normal; font-size: 0.7rem; }
    .stat b i.up { color: var(--green); }
    .stat b i.down { color: var(--red); }

    /* ── Общий прогресс на вкладке «Прогресс» ── */
    .sum-panel { padding-bottom: 14px; }
    .summary { display: grid; gap: 16px; justify-items: center; }

    .sum-ring { position: relative; width: min(210px, 62vw); }
    .sum-ring svg { width: 100%; height: auto; transform: rotate(-90deg); display: block; }
    .sum-ring circle { fill: none; stroke-width: 13; stroke-linecap: round; }
    .sum-ring .bg { stroke: var(--track); }
    .sum-ring .fg { stroke: url(#grad); transition: stroke-dasharray 0.8s cubic-bezier(0.22, 1, 0.36, 1); }
    .sum-txt {
      position: absolute; inset: 0;
      display: grid; place-content: center; justify-items: center; gap: 2px;
    }
    .sum-cap { font-size: 0.76rem; color: var(--muted); font-weight: 700; }
    .sum-txt b { font-size: 3rem; font-weight: 850; line-height: 1; letter-spacing: -0.04em; }
    .sum-sub { font-size: 0.8rem; color: var(--dim); }

    .sum-chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; width: 100%; }
    .sc {
      background: var(--glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-line);
      border-radius: 13px; padding: 9px 6px;
      display: grid; justify-items: center; gap: 2px; text-align: center;
    }
    .sc b { font-size: 0.95rem; font-weight: 850; white-space: nowrap; }
    .sc span { font-size: 0.6rem; color: var(--muted); line-height: 1.15; }
    .sc.hot { border-color: rgba(74, 222, 128, 0.4); background: rgba(74, 222, 128, 0.1); }
    .sc.hot b { color: var(--green); }

    .sum-week {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 6px; width: 100%; height: 86px;
      align-items: stretch;
    }
    .sw {
      display: flex; flex-direction: column;
      justify-content: flex-end; align-items: stretch;
      gap: 6px; height: 100%;
    }
    .sw i {
      display: block; width: 100%;
      min-height: 5px;
      border-radius: 6px 6px 3px 3px;
      background: rgba(255, 255, 255, 0.09);
      flex: 0 0 auto;
    }
    .sw.on i { background: linear-gradient(180deg, var(--gold), var(--gold-2)); }
    .sw.frozen i { background: repeating-linear-gradient(45deg, rgba(139,124,246,.5) 0 4px, rgba(139,124,246,.2) 4px 8px); }
    .sw.future i { opacity: 0.35; }
    .sw span { font-size: 0.65rem; color: var(--dim); font-weight: 700; text-align: center; height: 13px; flex: 0 0 auto; }
    .sw.today span { color: var(--gold); }

    .periods {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 4px; background: var(--card-2);
      border: 1px solid var(--line); border-radius: 13px;
      padding: 4px; margin-bottom: 16px;
    }
    .pbtn {
      min-height: 36px; border-radius: 10px;
      font-size: 0.85rem; font-weight: 750; color: var(--muted);
    }
    .pbtn.on { background: rgba(255, 201, 77, 0.16); color: var(--gold); }

    /* кружки недели */
    .wcircles { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; width: 100%; }
    .wc { display: grid; justify-items: center; gap: 5px; }
    .wc i {
      width: 100%; max-width: 40px; aspect-ratio: 1;
      border-radius: 50%;
      background: var(--glass);
      display: grid; place-items: center;
      font-style: normal; font-size: 0.82rem; font-weight: 800;
      color: var(--dim);
      border: 1.5px solid transparent;
    }
    .wc.on i { background: linear-gradient(140deg, var(--gold), var(--gold-2)); color: #241a05; }
    .wc.today i { border-color: rgba(255, 255, 255, 0.75); }
    .wc.frz i { background: rgba(139, 124, 246, 0.25); color: var(--violet); }
    .wc.fut i { opacity: 0.4; }
    .wc span { font-size: 0.66rem; color: var(--dim); font-weight: 700; }
    .wc.today span { color: var(--gold); }

    /* сетка месяца */
    .mgrid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 5px; width: 100%;
    }
    .mg-dow { font-size: 0.6rem; color: var(--dim); text-align: center; font-weight: 700; text-transform: uppercase; }
    .mg-cell {
      aspect-ratio: 1; border-radius: 50%;
      display: grid; place-items: center;
      font-size: 0.72rem; font-weight: 650; color: var(--dim);
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid transparent;
    }
    .mg-cell.blank { background: none; }
    .mg-cell.on { background: rgba(255, 201, 77, 0.45); color: #241a05; font-weight: 800; }
    .mg-cell.hi { background: linear-gradient(140deg, var(--gold), var(--gold-2)); }
    .mg-cell.frz { background: rgba(139, 124, 246, 0.22); color: var(--violet); }
    .mg-cell.today { border-color: rgba(255, 255, 255, 0.7); }
    .mg-cell.fut { opacity: 0.35; }

    .trend {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 14px;
      padding: 10px 8px 8px;
    }

    .period-hint {
      font-size: 0.72rem; color: var(--dim);
      text-align: center; line-height: 1.4;
    }

    /* линейный график недели */
    .wline { width: 100%; }
    .wline svg { width: 100%; height: 118px; display: block; overflow: visible; }
    .wl-days { display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 2px; }
    .wl-days span { font-size: 0.68rem; color: var(--dim); font-weight: 700; text-align: center; }
    .wl-days span.now { color: var(--gold); }
    .wl-days span.frz { color: var(--violet); }

    /* общий календарь с точками по хобби */
    .day { position: relative; display: grid; place-content: center; gap: 3px; }
    .day b { font-weight: 650; font-size: 0.85rem; }
    .day.has b { color: var(--ink); }
    .day.frozen { background: rgba(139, 124, 246, 0.12); }
    .dots-row { display: flex; gap: 2px; justify-content: center; height: 5px; }
    .dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
    .dot.p { background: var(--gold); }
    .dot.b { background: var(--violet); }
    .dot.c { background: #f0a3b5; }
    .dot.f { background: rgba(139, 124, 246, 0.5); }
    .cal-legend {
      display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
      margin-top: 12px; font-size: 0.72rem; color: var(--dim);
    }
    .cal-legend span { display: inline-flex; align-items: center; gap: 5px; }

    .day-list { display: grid; gap: 7px; }
    .day-freeze {
      font-size: 0.82rem; color: var(--violet);
      background: rgba(139, 124, 246, 0.1);
      border-radius: 11px; padding: 9px 11px; margin-bottom: 10px;
    }
    .day-add { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 11px; }
    .da {
      min-height: 42px; border-radius: 12px;
      background: var(--card-2); border: 1px solid var(--line);
      font-size: 0.8rem; font-weight: 700; color: var(--muted);
    }
    .da:active { border-color: rgba(255, 201, 77, 0.5); color: var(--ink); }

    .by-hobby { display: grid; gap: 7px; margin-bottom: 12px; }
    .hb-row {
      display: grid; grid-template-columns: 30px 1fr auto;
      align-items: center; gap: 11px;
      background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; padding: 11px 13px;
      text-align: left; width: 100%;
    }
    .hb-row.on { border-color: rgba(255, 201, 77, 0.45); background: rgba(255, 201, 77, 0.07); }
    .hb-ic { font-size: 1.2rem; text-align: center; }
    .hb-nm { font-size: 0.92rem; font-weight: 700; }
    .hb-nm i { display: block; font-style: normal; font-size: 0.75rem; color: var(--dim); font-weight: 500; margin-top: 2px; }
    .hb-pct { font-weight: 850; color: var(--gold); }

    /* предупреждения о синхронизации */
    #banner:empty { display: none; }
    .warn {
      display: flex; align-items: center; gap: 10px;
      background: rgba(139, 124, 246, 0.12);
      border: 1px solid rgba(139, 124, 246, 0.4);
      border-radius: 13px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 0.82rem;
      line-height: 1.35;
      color: var(--muted);
    }
    .warn b { color: var(--ink); }
    .warn.upd {
      background: rgba(255, 201, 77, 0.12);
      border-color: rgba(255, 201, 77, 0.45);
    }
    .warn.upd button { background: linear-gradient(140deg, var(--gold), var(--gold-2)); color: #241a05; }

    .warn.err {
      background: rgba(248, 113, 113, 0.1);
      border-color: rgba(248, 113, 113, 0.4);
    }
    .warn button {
      margin-left: auto;
      flex-shrink: 0;
      min-height: 32px;
      padding: 0 12px;
      border-radius: 10px;
      background: var(--glass-2);
      color: var(--ink);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .cta.locked {
      background: var(--card);
      border: 1px dashed rgba(139, 124, 246, 0.5);
      color: var(--violet);
      box-shadow: none;
      font-size: 1rem;
    }

    .recent {
      display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
      margin-top: 10px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .recent b { color: var(--ink); font-weight: 800; }

    /* ══════════ ГЛАВНАЯ ══════════ */
    .hero {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(6px, 1.2vh, 15px);
      padding-bottom: clamp(4px, 1.2vh, 12px);
    }

    /* карусель обложек */
    .rail {
      width: 100%;
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding: 6px 0;
      /* лента сжимается, если экрану не хватает высоты */
      height: clamp(210px, 39vh, 310px);
      flex: 0 1 auto;
      min-height: 172px;
      box-sizing: border-box;
    }
    .rail::-webkit-scrollbar { display: none; }

    .slot {
      flex: 0 0 auto;
      height: 100%;
      scroll-snap-align: center;
      transition: opacity 0.25s, transform 0.25s;
      opacity: 0.42;
      transform: scale(0.9);
    }
    .slot.on { opacity: 1; transform: scale(1); }

    .dots { display: flex; gap: 6px; margin-top: -4px; }
    .dots i {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      transition: background 0.25s, width 0.25s;
    }
    .dots i.on { background: var(--gold); width: 18px; border-radius: 3px; }

    .cover {
      height: 100%;
      width: auto;
      aspect-ratio: 3 / 4.1;
      border-radius: 4px 12px 12px 4px;      /* у корешка сгиб острее, чем у обреза */
      position: relative;
      overflow: hidden;
      /* тень книги: контактная у стола, мягкая от объёма и дальняя рассеянная */
      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.5),
        0 6px 12px rgba(0, 0, 0, 0.4),
        0 18px 34px rgba(0, 0, 0, 0.45),
        0 34px 60px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.07);
      display: grid;
      padding: 18px 16px 18px 22px;
      align-content: space-between;
      text-align: left;
      transform: rotate(-1.2deg);
    }
    /* корешок слева и обрез страниц справа */
    .cover::before {
      content: "";
      position: absolute; inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg,
          rgba(0, 0, 0, 0.42) 0,
          rgba(0, 0, 0, 0.22) 5px,
          rgba(255, 255, 255, 0.09) 7px,
          rgba(255, 255, 255, 0.02) 11px,
          transparent 22px),
        linear-gradient(270deg,
          rgba(255, 255, 255, 0.16) 0,
          rgba(255, 255, 255, 0.05) 2px,
          rgba(0, 0, 0, 0.18) 4px,
          transparent 9px);
    }
    .cover::after {
      content: "";
      position: absolute; inset: 0;
      pointer-events: none;
      background:
        linear-gradient(105deg, rgba(255, 255, 255, 0.14), transparent 42%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 18%, transparent 82%, rgba(0, 0, 0, 0.22));
    }
    /* настоящая обложка: пропорции издания, ничего не обрезается */
    .cover.photo {
      height: 100%; width: auto;
      padding: 0;
      background: #0c0a12;
      display: block;
    }
    .cover.photo img {
      width: 100%; height: 100%;
      object-fit: cover;              /* пропорции заданы точно, так что кадрировать нечего */
      display: block;
      border-radius: inherit;
    }
    .shelf-cover.photo { width: 92px; height: auto; }

    .cover.book {
      background: linear-gradient(165deg, #232b3d, #131722 60%, #0f1219);
    }
    .cover.book.snow {
      background: linear-gradient(165deg, #26303f, #161d28 60%, #101419);
    }
    .cover.book.night {
      background: linear-gradient(165deg, #1e2a3f, #141b28 58%, #0d1119);
    }
    .cover.book.wine {
      background: linear-gradient(165deg, #3a1f2a, #23131b 58%, #170d13);
    }
    .cover.book.forest {
      background: linear-gradient(165deg, #1e3128, #14211b 58%, #0e1714);
    }
    .cover.piano.violet {
      background: linear-gradient(165deg, #2b2338, #1a1524 60%, #12101a);
    }
    .cover.piano.sea {
      background: linear-gradient(165deg, #1c3446, #14222f 58%, #0f1720);
    }
    .wave { width: 100%; height: clamp(52px, 12vh, 76px); display: block; }

    .cover.pastel { background: linear-gradient(165deg, #3a2436, #241a26 58%, #171119); }
    .smears { display: flex; gap: 5px; height: 44px; align-items: flex-end; }
    .smears i {
      flex: 1; border-radius: 8px 8px 3px 3px;
      background: linear-gradient(180deg, rgba(255,255,255,.15), transparent);
    }
    .smears i:nth-child(1) { height: 70%; background: linear-gradient(180deg, #f0a3b5, rgba(240,163,181,0)); }
    .smears i:nth-child(2) { height: 100%; background: linear-gradient(180deg, #ffc94d, rgba(255,201,77,0)); }
    .smears i:nth-child(3) { height: 55%; background: linear-gradient(180deg, #8ad6c0, rgba(138,214,192,0)); }
    .smears i:nth-child(4) { height: 84%; background: linear-gradient(180deg, #a99cf9, rgba(169,156,249,0)); }
    .cv-author { font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); font-weight: 800; }
    .cv-title {
      font-size: clamp(0.95rem, 3.6vw, 1.24rem);
      font-weight: 800;
      line-height: 1.12;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .cv-sub { font-size: 0.68rem; color: var(--muted); margin-top: 5px; }
    .cv-mark { font-size: 1.6rem; opacity: 0.9; }

    /* клавиши для обложки пианино */
    .keys { position: relative; height: 38px; display: flex; gap: 1.5px; }
    .keys .w { flex: 1; background: rgba(255,255,255,0.86); border-radius: 0 0 3px 3px; }
    .keys .b {
      position: absolute; top: 0;
      width: 8.5%; height: 61%;
      background: #16121f; border-radius: 0 0 2px 2px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    /* по кольцу можно постучать — жест спрятан, поэтому вида кнопки у него нет */
    .ring-wrap {
      display: grid; place-items: center; position: relative;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      padding: 6px;                                  /* попасть пальцем проще, вида кнопки по-прежнему нет */
    }
    .ring-wrap:active { transform: scale(0.98); transition: transform 0.12s; }
    .ring { transform: rotate(-90deg); width: clamp(88px, 13vh, 116px); height: auto; }
    .ring circle { fill: none; stroke-width: 7; stroke-linecap: round; }
    .ring .bg { stroke: var(--track); }
    .ring .fg { stroke: url(#grad); transition: stroke-dasharray 0.9s cubic-bezier(0.22, 1, 0.36, 1); }
    .ring-txt {
      position: absolute;
      display: grid; justify-items: center; gap: 1px;
    }
    .ring-txt b {
      font-size: clamp(1.35rem, 3.4vh, 1.72rem);
      font-weight: 850; line-height: 1;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .hero-title { text-align: center; display: grid; gap: 4px; }
    .hero-title h2 { margin: 0; font-size: clamp(0.98rem, 1.9vh, 1.14rem); font-weight: 800; line-height: 1.18; }
    .hero-title p { margin: 0; color: var(--muted); font-size: clamp(0.78rem, 1.5vh, 0.86rem); }
    .pace { font-size: clamp(0.7rem, 1.3vh, 0.78rem); color: var(--dim); }
    /* части подписи не рвутся посреди фразы — переносится сразу вся */
    .sub-part { display: inline-block; }

    .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      min-height: 30px; padding: 0 10px;
      border-radius: 15px;
      background: var(--card); border: 1px solid var(--line);
      font-size: 0.76rem; font-weight: 650; color: var(--muted);
      white-space: nowrap;
    }
    .chip b { color: var(--ink); font-weight: 800; }
    .chip.hot { border-color: rgba(255, 157, 63, 0.4); background: rgba(255, 157, 63, 0.1); }
    .chip.tap { cursor: pointer; }
    .chip.tap:active { background: var(--card-2); }

    .ach-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      line-height: 1.25;
    }

    .cta {
      width: 100%;
      min-height: clamp(50px, 7vh, 58px);
      flex-shrink: 0;
      margin-top: clamp(0px, 0.6vh, 8px);
      border-radius: 17px;
      background: linear-gradient(140deg, var(--gold), var(--gold-2));
      color: #241a05;
      font-size: clamp(1rem, 2vh, 1.1rem); font-weight: 850;
      display: flex; align-items: center; justify-content: center; gap: 9px;
      box-shadow: 0 10px 28px rgba(255, 175, 60, 0.28);
      transition: transform 0.1s;
      margin-top: 4px;
    }
    .cta:active { transform: scale(0.98); }
    .cta.done {
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--muted);
      box-shadow: none;
      font-size: 0.98rem;
      font-weight: 700;
    }
    .cta.done .cta-ok { color: var(--ink); font-weight: 750; }
    .cta.done .cta-add {
      color: var(--violet);
      font-weight: 750;
      padding-left: 10px;
      border-left: 1px solid var(--line);
    }

    .logo { cursor: pointer; }

    .shake-hint:empty { display: none; }
    .shake-hint button {
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 32px;
      padding: 0 10px;
      border-radius: 10px;
      border: 1px dashed var(--line);
    }
    .shake-hint button:active { color: var(--ink); border-color: rgba(255,201,77,0.5); }

    .nudge:empty { display: none; }
    .nudge {
      text-align: center;
      font-size: clamp(0.78rem, 1.5vh, 0.86rem);
      color: var(--muted);
      line-height: 1.35;
      padding: 0 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .nudge b { color: var(--gold); }

    /* ══════════ ПРОГРЕСС ══════════ */
    .panel {
      background: var(--panel);
      backdrop-filter: blur(22px) saturate(1.5);
      -webkit-backdrop-filter: blur(22px) saturate(1.5);
      border: 1px solid var(--glass-line);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: inset 0 1px 0 var(--glass-hi), 0 12px 32px rgba(0, 0, 0, 0.35);
    }
    .panel h3 {
      margin: 0 0 13px;
      font-size: 0.78rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted);
    }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .stat {
      background: var(--glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-line);
      border-radius: 13px; padding: 11px 12px;
    }
    .stat b { font-size: 1.28rem; font-weight: 800; display: block; }
    .stat span { font-size: 0.71rem; color: var(--muted); line-height: 1.2; }

    .bar-strip {
      display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 2px;
      background: rgba(255,255,255,0.04); border-radius: 7px; padding: 3px;
    }
    .bar { height: 18px; border-radius: 2px; background: var(--track); }
    .bar.tick { margin-right: 2px; }
    .bar.l1.r { background: rgba(255, 201, 77, 0.32); }
    .bar.l2.r { background: rgba(255, 201, 77, 0.62); }
    .bar.l3.r { background: linear-gradient(180deg, var(--gold), var(--gold-2)); }
    .bar.l1.l { background: rgba(139, 124, 246, 0.32); }
    .bar.l2.l { background: rgba(139, 124, 246, 0.62); }
    .bar.l3.l { background: linear-gradient(180deg, #a99cf9, var(--violet)); }

    .hand { display: grid; gap: 7px; margin-bottom: 14px; }
    .hand-head { display: flex; justify-content: space-between; font-size: 0.86rem; color: var(--muted); }
    .hand-head b { color: var(--ink); font-weight: 800; }

    .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.73rem; color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend .bar { width: 13px; height: 13px; border-radius: 3px; }

    .pages-bar { position: relative; height: 20px; border-radius: 8px; background: rgba(255,255,255,0.06); overflow: hidden; }
    .pages-fill {
      position: absolute; inset: 0 auto 0 0; border-radius: 8px;
      background: linear-gradient(90deg, var(--gold), var(--gold-2));
      box-shadow: 0 0 16px rgba(255, 190, 70, 0.4);
    }

    .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .cal-title { font-weight: 750; text-transform: capitalize; }
    .cal-nav { display: flex; gap: 6px; }
    .cal-nav button {
      width: 32px; height: 32px; border-radius: 10px;
      background: var(--card-2); border: 1px solid var(--line); color: var(--muted);
    }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .dow { text-align: center; font-size: 0.66rem; color: var(--dim); font-weight: 700; text-transform: uppercase; }
    .day {
      aspect-ratio: 1; border-radius: 11px;
      display: grid; place-items: center;
      font-size: 0.85rem; font-weight: 650; color: var(--muted);
      background: rgba(255,255,255,0.03); border: 1px solid transparent;
    }
    .day.blank { background: none; }
    .day.on { background: rgba(255, 179, 60, 0.5); color: #241a05; font-weight: 800; }
    .day.nodata { background: rgba(139,124,246,0.1); border: 1px dashed rgba(139,124,246,0.5); color: var(--ink); }
    .day.today { border-color: rgba(139, 124, 246, 0.85); }
    .day.sel { outline: 2px solid var(--gold); outline-offset: -1px; }
    .day.future { opacity: 0.32; }

    .rec {
      display: grid; grid-template-columns: auto 1fr auto;
      align-items: center; gap: 11px;
      background: var(--card-2); border: 1px solid var(--line);
      border-radius: 13px; padding: 10px 12px;
    }
    .rec .what { font-weight: 800; color: var(--gold); white-space: nowrap; font-size: 0.92rem; }
    .rec .note { color: var(--muted); font-size: 0.86rem; overflow-wrap: anywhere; }
    .rec .del { color: var(--dim); width: 30px; height: 30px; border-radius: 8px; font-size: 1rem; }
    .empty { color: var(--dim); font-size: 0.87rem; text-align: center; padding: 4px 0; }

    .day-nav { display: flex; align-items: center; gap: 4px; }
    .day-nav button { min-height: 30px; padding: 0 8px; border-radius: 9px; color: var(--muted); }
    .day-nav .cur { color: var(--gold); font-weight: 700; font-size: 0.86rem; border-bottom: 1px dashed rgba(255,201,77,0.5); }
    .day-nav button:disabled { opacity: 0.25; }

    /* ══════════ ДОСТИЖЕНИЯ ══════════ */
    .ach-top {
      display: grid; gap: 10px;
      background: var(--card); border: 1px solid var(--line);
      border-radius: 17px; padding: 16px; margin-bottom: 12px;
    }
    .ach-count { display: flex; align-items: baseline; gap: 8px; }
    .ach-count b { font-size: 1.7rem; font-weight: 850; }
    .ach-count span { color: var(--muted); font-size: 0.9rem; }
    .ach-progress { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
    .ach-progress i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--gold), var(--gold-2)); }

    .ach-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }

    /* карточки знаний — лента, где всё видно сразу */
    .feed-head {
      font-size: 0.8rem; color: var(--muted);
      background: var(--glass); border: 1px solid var(--glass-line);
      border-radius: 12px; padding: 9px 12px; margin-bottom: 11px;
    }
    .feed { display: grid; gap: 11px; }
    .post {
      background: var(--glass);
      backdrop-filter: blur(16px) saturate(1.35);
      -webkit-backdrop-filter: blur(16px) saturate(1.35);
      border: 1px solid var(--glass-line);
      border-radius: 18px; padding: 14px 15px;
      box-shadow: inset 0 1px 0 var(--glass-hi);
    }
    .post-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .post-top .fi {
      width: 28px; height: 28px; border-radius: 9px; flex-shrink: 0;
      display: grid; place-items: center; font-size: 0.85rem;
      background: linear-gradient(145deg, var(--gold), var(--gold-2));
    }
    .post-top h4 { margin: 0; font-size: 0.94rem; font-weight: 750; line-height: 1.25; }
    .post-text { margin: 0; font-size: 0.88rem; line-height: 1.5; color: var(--ink); opacity: 0.92; }
    .post.thought .post-text { white-space: pre-wrap; font-size: 0.95rem; line-height: 1.55; opacity: 1; }
    .post-dig {
      margin-top: 10px; padding-top: 10px;
      border-top: 1px solid var(--glass-line);
      display: grid; gap: 6px;
    }

    /* карточки знаний — компактная сетка */
    .facts-note { font-size: 0.82rem; color: var(--muted); margin-bottom: 10px; }
    .facts-note b { color: var(--ink); }
    .facts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
    .fcard {
      display: grid; gap: 7px; align-content: start;
      min-height: 96px;
      background: var(--glass);
      backdrop-filter: blur(14px) saturate(1.3);
      -webkit-backdrop-filter: blur(14px) saturate(1.3);
      border: 1px solid var(--glass-line);
      border-radius: 16px; padding: 12px;
      text-align: left; width: 100%;
      box-shadow: inset 0 1px 0 var(--glass-hi);
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s;
    }
    .fcard:active { transform: scale(0.96); }
    .fcard .fi {
      width: 30px; height: 30px; border-radius: 10px;
      display: grid; place-items: center; font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.08);
    }
    .fcard .ft { font-size: 0.83rem; font-weight: 700; line-height: 1.3; }
    .fcard.open { border-color: rgba(255, 201, 77, 0.3); }
    .fcard.open .fi {
      background: linear-gradient(145deg, #ffd977, #ffa63f);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 5px 14px rgba(255, 157, 63, 0.25);
    }
    .fcard.open .ft { color: var(--ink); }
    .fcard.locked { opacity: 0.5; }
    .fcard.locked .ft { color: var(--muted); font-weight: 600; }

    .empty-note { font-size: 0.85rem; color: var(--dim); text-align: center; padding: 20px 0; }

    .ach-hero { display: flex; align-items: center; gap: 12px; }
    .ach-hero-txt { display: grid; gap: 3px; min-width: 0; }
    .ach-hero-txt b { font-size: 1rem; line-height: 1.2; }
    .ach-hero-txt em { font-style: normal; font-size: 0.8rem; color: var(--muted); }
    .ach-sub { font-size: 0.84rem; color: var(--muted); line-height: 1.35; }
    .ach-sub b { color: var(--ink); }

    /* несколько карточек сразу — списком с прокруткой */
    .cheer-list { display: grid; gap: 14px; text-align: left; max-height: 52vh; overflow-y: auto; padding-right: 4px; }
    .cheer-item { display: grid; gap: 5px; }
    .cheer-item b { font-size: 0.94rem; font-weight: 750; line-height: 1.25; }
    .cheer-item i { font-style: normal; font-size: 0.86rem; line-height: 1.45; color: var(--muted); }
    .cheer-item em { font-style: normal; font-size: 0.78rem; color: var(--dim); line-height: 1.35; }

    .cheer.fact .cheer-ic { background: linear-gradient(140deg, #ffd977, #ffb44d); }
    .cheer.fact p { max-width: 330px; font-size: 0.92rem; }

    .dig {
      width: 100%;
      background: var(--card-2); border: 1px solid var(--line);
      border-radius: 13px; padding: 12px 13px;
      text-align: left; display: grid; gap: 7px;
    }
    .dig-head {
      font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--gold);
    }
    .dig-item { font-size: 0.86rem; color: var(--muted); line-height: 1.4; }
    .dig-item::before { content: "→ "; color: var(--dim); }

    .cheer-dig {
      display: block; margin-top: 12px;
      font-size: 0.84rem; color: var(--gold); line-height: 1.4;
    }

    /* входной список материалов на вкладке наград */
    .mat-list { display: grid; gap: 9px; }
    .mat-card {
      display: grid; grid-template-columns: 52px 1fr 14px;
      align-items: center; gap: 13px;
      background: var(--glass);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      border: 1px solid var(--glass-line);
      border-radius: 18px; padding: 13px 14px;
      text-align: left; width: 100%;
      box-shadow: inset 0 1px 0 var(--glass-hi);
    }
    .mat-card:active { border-color: rgba(255, 201, 77, 0.45); }

    /* плитка с иконкой материала */
    .mc-tile {
      width: 52px; height: 52px; border-radius: 16px;
      display: grid; place-items: center;
      position: relative; overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 6px 18px rgba(0, 0, 0, 0.35);
    }
    .mc-tile i { font-style: normal; font-size: 1.4rem; line-height: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.35)); }
    .mc-tile::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(150deg, rgba(255,255,255,0.28), transparent 55%);
    }
    .mc-tile.big { width: 60px; height: 60px; border-radius: 19px; }
    .mc-tile.big i { font-size: 1.65rem; }
    .t-piano { background: linear-gradient(145deg, #6f5ff0, #3b2c8f); }
    .t-book { background: linear-gradient(145deg, #ffb257, #d1622a); }
    .t-pastel { background: linear-gradient(145deg, #4fb8a4, #2b6f7e); }

    .mc-body { display: grid; gap: 6px; min-width: 0; }
    .mc-title { font-size: 0.94rem; font-weight: 700; line-height: 1.2; }
    .mc-sub { font-size: 0.75rem; color: var(--dim); line-height: 1.2; margin-top: -2px; }
    .mc-tags { display: flex; gap: 8px; }
    .mc-tags em {
      font-style: normal; font-size: 0.72rem; font-weight: 700; color: var(--muted);
      background: var(--glass); border-radius: 7px; padding: 2px 7px;
    }
    .mc-go { font-size: 1.2rem; color: var(--dim); }
    .mc-bar { height: 6px; border-radius: 3px; background: var(--glass-2); overflow: hidden; }
    .mc-bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--gold), var(--gold-2)); }
    .mc-num { font-size: 1.05rem; font-weight: 850; color: var(--gold); white-space: nowrap; }
    .mc-num i { font-style: normal; font-size: 0.78rem; color: var(--dim); font-weight: 700; }

    .back {
      display: inline-flex; align-items: center;
      min-height: 36px; padding: 0 12px 0 6px;
      margin-bottom: 10px;
      border-radius: 11px;
      color: var(--violet); font-weight: 700; font-size: 0.88rem;
    }
    .back:active { background: var(--card); }
    .ach {
      aspect-ratio: 1;
      border-radius: 18px;
      background: var(--glass);
      backdrop-filter: blur(14px) saturate(1.3);
      -webkit-backdrop-filter: blur(14px) saturate(1.3);
      border: 1px solid var(--glass-line);
      box-shadow: inset 0 1px 0 var(--glass-hi);
      display: grid; place-items: center; align-content: center; gap: 7px;
      padding: 8px 6px; text-align: center;
    }
    /* иконка достижения — на круглой подложке */
    .ach .ic {
      width: 46px; height: 46px; border-radius: 50%;
      display: grid; place-items: center;
      font-size: 1.35rem; line-height: 1;
      background: var(--glass-2);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
    .ach .nm { font-size: 0.66rem; line-height: 1.15; color: var(--muted); font-weight: 650; }
    .ach.open {
      border-color: rgba(255, 201, 77, 0.4);
      background: linear-gradient(180deg, rgba(255, 201, 77, 0.15), rgba(255, 201, 77, 0.04));
    }
    .ach.open .ic {
      background: linear-gradient(150deg, rgba(255, 217, 119, 0.95), rgba(255, 157, 63, 0.85));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 6px 16px rgba(255, 157, 63, 0.28);
    }
    .ach.open .nm { color: var(--ink); }
    .ach.next { border-color: rgba(139, 124, 246, 0.45); }
    .ach.next .ic { background: rgba(139, 124, 246, 0.22); }
    .ach.locked .ic i, .ach.locked .ic { filter: none; }
    .ach.locked .ic { opacity: 0.85; }
    .ach.locked:not(.next) .ic { opacity: 0.55; }
    .ach.locked .nm { color: var(--dim); }

    /* ══════════ Нижняя навигация ══════════ */
    .tabbar {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(460px, 100%);
      display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
      background: var(--bar);
      backdrop-filter: blur(26px) saturate(1.6);
      -webkit-backdrop-filter: blur(26px) saturate(1.6);
      border-top: 1px solid var(--glass-line);
      box-shadow: inset 0 1px 0 var(--glass-hi);
      padding: 6px 10px max(8px, calc(env(safe-area-inset-bottom) * 0.45));
      z-index: 20;
    }
    /* страховка: закрывает полосу под таббаром, если система оставляет запас */
    .tabbar::after {
      content: "";
      position: absolute;
      left: 0; right: 0; top: 100%;
      height: 80px;
      background: var(--bar);
      backdrop-filter: blur(26px) saturate(1.6);
      -webkit-backdrop-filter: blur(26px) saturate(1.6);
    }
    .tabbar button { transition: color 0.22s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .tabbar button:active { transform: scale(0.9); }
    .tabbar button {
      display: grid; justify-items: center; gap: 2px;
      padding: 3px 0; border-radius: 12px;
      color: var(--dim); font-size: 0.68rem; font-weight: 700;
    }
    .tabbar button i { font-style: normal; font-size: 1.15rem; }
    .tabbar button.on { color: var(--gold); }

    /* ══════════ Шторка отметки ══════════ */
    .sheet-bg {
      position: fixed; inset: 0;
      transition: opacity 0.22s;
      background: rgba(5, 4, 10, 0.6);
      backdrop-filter: blur(10px) saturate(1.3);
      -webkit-backdrop-filter: blur(10px) saturate(1.3);
      opacity: 0; pointer-events: none;
      transition: opacity 0.22s;
      z-index: 30;
    }
    .sheet-bg.show { opacity: 1; pointer-events: auto; }

    .sheet {
      position: fixed;
      left: 50%; bottom: 0;
      transform: translateX(-50%) translateY(100%);
      width: min(460px, 100%);
      background: var(--sheet);
      backdrop-filter: blur(30px) saturate(1.7);
      -webkit-backdrop-filter: blur(30px) saturate(1.7);
      border-radius: 26px 26px 0 0;
      border-top: 1px solid var(--glass-line);
      box-shadow: inset 0 1px 0 var(--glass-hi), 0 -20px 60px rgba(0, 0, 0, 0.5);
      padding: 0;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      overscroll-behavior: contain;
      z-index: 31;
      max-height: 92vh;
      display: flex; flex-direction: column;
      overflow: hidden;                       /* вбок ничего не ездит */
    }
    .sheet.show { transform: translateX(-50%) translateY(0); }
    /* зона захвата: тянешь её — уезжает вся шторка */
    .grab-zone {
      flex-shrink: 0;
      padding: 11px 16px 9px;
      cursor: grab;
      touch-action: none;
    }
    .grab-zone:active { cursor: grabbing; }
    .grabber { width: 44px; height: 5px; border-radius: 3px; background: #3a3550; margin: 0 auto; }

    .sheet-body {
      flex: 1; min-height: 0;
      overflow-y: auto; overflow-x: hidden;
      overscroll-behavior: contain;
      padding: 0 16px max(20px, calc(env(safe-area-inset-bottom) + 6px));
    }
    .sheet-body > * { max-width: 100%; }

    .sheet h3 { margin: 0 0 4px; font-size: 1.15rem; }
    .sheet .sub { margin: 0 0 16px; color: var(--muted); font-size: 0.86rem; }

    .hand-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 14px; }
    .hp {
      min-height: 46px; border-radius: 13px;
      background: var(--card-2); border: 1px solid var(--line);
      color: var(--muted); font-weight: 700; font-size: 0.92rem;
    }
    .hp.on {
      color: var(--ink); border-color: rgba(255, 201, 77, 0.6);
      background: linear-gradient(180deg, rgba(255,201,77,0.16), rgba(255,201,77,0.05));
    }

    .range { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .range-part { display: grid; gap: 5px; justify-items: center; }
    .rp-label { font-size: 0.74rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; font-weight: 700; }

    .stepper {
      display: flex; align-items: center; gap: 6px;
      background: var(--card-2); border: 1px solid var(--line);
      border-radius: 14px; padding: 4px;
    }
    .st-btn {
      width: 46px; height: 46px; border-radius: 11px;
      background: rgba(255,255,255,0.06);
      font-size: 1.3rem; font-weight: 700;
      display: grid; place-items: center;
    }
    .st-btn:active { background: rgba(255, 201, 77, 0.25); }
    .st-val { min-width: 52px; text-align: center; font-size: 1.25rem; font-weight: 800; color: var(--gold); }

    .page-pick { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; }
    .pp-label { font-size: 0.95rem; font-weight: 700; line-height: 1.25; }
    .pp-label i { font-style: normal; color: var(--muted); font-size: 0.76rem; font-weight: 500; }

    .quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-top: 12px; }
    .qbtn {
      min-height: 42px; border-radius: 12px;
      background: var(--card-2); border: 1px solid var(--line);
      font-weight: 750; color: var(--gold);
    }

    .pending { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
    .pchip {
      min-height: 34px; padding: 0 12px; border-radius: 17px;
      background: rgba(74,222,128,0.14); border: 1px solid rgba(74,222,128,0.35);
      color: var(--green); font-weight: 700; font-size: 0.85rem;
    }
    .link-btn { color: var(--violet); font-weight: 650; font-size: 0.88rem; min-height: 36px; margin-top: 10px; }

    .note-input {
      width: 100%; min-height: 46px; border-radius: 13px;
      background: var(--card-2); border: 1px solid var(--line);
      padding: 0 13px; outline: none; margin-top: 14px;
      font-size: 16px;            /* меньше — и iOS приближает весь экран при фокусе */
    }
    textarea.note-input { padding: 11px 13px; line-height: 1.45; }
    .note-input::placeholder { color: var(--dim); }

    /* контролы: iOS рисует их по-своему — приводим к одному виду */
    input.note-input, textarea.note-input, select.note-input {
      -webkit-appearance: none; appearance: none;
      font-family: inherit; color: var(--ink);
      max-width: 100%;
    }
    input[type="date"].note-input {
      width: 100%; min-width: 0; height: 46px;
      text-align: left;
      display: flex; align-items: center;      /* иначе iOS прижимает дату к верхнему краю */
      line-height: normal;
    }
    input[type="date"]::-webkit-datetime-edit {
      display: flex; align-items: center;
      height: 100%; padding: 0;
    }
    /* без этого iOS прижимает дату к правому краю */
    input[type="date"]::-webkit-date-and-time-value { text-align: left; margin: 0; }
    input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.55; margin-left: auto; }
    input[type="date"]::-webkit-datetime-edit { padding: 0; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .note-input:focus { border-color: rgba(139, 124, 246, 0.6); }

    .sheet-actions { display: grid; gap: 9px; margin-top: 18px; }
    .btn {
      width: 100%;
      min-height: 52px; border-radius: 15px;
      background: var(--card-2); border: 1px solid var(--line);
      font-weight: 750;
    }
    .btn.gold { background: linear-gradient(140deg, var(--gold), var(--gold-2)); border: 0; color: #241a05; font-weight: 850; }
    .btn.danger { color: var(--red); }
    .info-note {
      font-size: 0.85rem; color: var(--muted); line-height: 1.45;
      background: var(--card-2); border-radius: 12px; padding: 11px 13px;
    }
    .info-note a { color: var(--violet); }
    .info-note b { color: var(--ink); }

    .diag {
      margin-top: 6px;
      text-align: center;
      font-size: 0.68rem;
      color: var(--dim);
      font-variant-numeric: tabular-nums;
      line-height: 1.4;
    }

    .version {
      margin-top: 14px;
      text-align: center;
      font-size: 0.76rem;
      color: var(--dim);
      font-variant-numeric: tabular-nums;
    }

    /* ── Движение и отклик ───────────── */
    @media (prefers-reduced-motion: no-preference) {
      #view > * { animation: riseIn 0.34s cubic-bezier(0.22, 1, 0.36, 1) both; }
      #view > *:nth-child(2) { animation-delay: 0.04s; }
      #view > *:nth-child(3) { animation-delay: 0.08s; }
      #view > *:nth-child(4) { animation-delay: 0.12s; }
      .hero > * { animation: riseIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .hero > *:nth-child(2) { animation-delay: 0.05s; }
      .hero > *:nth-child(3) { animation-delay: 0.09s; }
      .hero > *:nth-child(4) { animation-delay: 0.13s; }
    }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(10px) scale(0.99); }
      to { opacity: 1; transform: none; }
    }

    /* пружинистый отклик на нажатие */
    .btn, .cta, .qbtn, .hp, .st-btn, .gbtn, .pbtn, .mat-card, .ach, .fact.open, .da, .lesson {
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .btn:active, .qbtn:active, .hp:active, .st-btn:active, .gbtn:active,
    .pbtn:active, .mat-card:active, .ach:active, .fact.open:active, .da:active, .lesson:active { transform: scale(0.96); }
    .cta:active { transform: scale(0.975); }

    /* стеклянные кнопки-действия */
    .btn {
      background: var(--glass);
      backdrop-filter: blur(14px) saturate(1.3);
      -webkit-backdrop-filter: blur(14px) saturate(1.3);
      border: 1px solid var(--glass-line);
    }
    .cta {
      position: relative;
      overflow: hidden;
    }
    /* блик, пробегающий по главной кнопке */
    .cta::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.45) 48%, transparent 66%);
      transform: translateX(-120%);
      animation: sheen 5.5s ease-in-out 1.2s infinite;
      pointer-events: none;
    }
    .cta.done::after, .cta.locked::after { display: none; }
    @keyframes sheen {
      0% { transform: translateX(-120%); }
      18%, 100% { transform: translateX(120%); }
    }

    /* кольцо прогресса светится */
    .ring .fg, .sum-ring .fg { filter: drop-shadow(0 0 6px rgba(255, 190, 70, 0.45)); }

    /* обложка мягко приподнимается, когда становится активной */
    .slot { transition: opacity 0.32s ease, transform 0.42s cubic-bezier(0.22, 1, 0.36, 1); }
    .cover { transition: box-shadow 0.4s ease, transform 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
    .slot:not(.on) .cover {
      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.4),
        0 6px 14px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.05);
    }
        .slot.on .cover {
      box-shadow:
        0 2px 3px rgba(0, 0, 0, 0.5),
        0 8px 16px rgba(0, 0, 0, 0.42),
        0 22px 40px rgba(0, 0, 0, 0.48),
        0 40px 70px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(255, 255, 255, 0.09);
    }

    /* ── Пустые состояния и выбор профиля ── */
    .empty-state {
      display: grid; justify-items: center; align-content: center; gap: 10px;
      text-align: center; min-height: 60vh; padding: 20px;
    }
    .es-mark { font-size: 2.4rem; color: var(--dim); opacity: 0.5; }
    .empty-state h2 { margin: 0; font-size: 1.06rem; font-weight: 800; }
    .empty-state p { margin: 0; max-width: 300px; color: var(--muted); font-size: 0.88rem; line-height: 1.45; }
    .crash-why {
      font-size: 0.72rem; color: var(--dim); opacity: 0.75;
      max-width: 300px; word-break: break-word;
    }

    .pick-wrap {
      display: grid; align-content: center; gap: 22px;
      min-height: 70vh; padding: 8px 4px;
    }
    .pick-head { display: grid; justify-items: center; gap: 10px; text-align: center; }
    .pick-head p { margin: 0; max-width: 300px; color: var(--muted); font-size: 0.88rem; line-height: 1.45; }
    .logo.big { font-size: 1.9rem; }
    .pick-list { display: grid; gap: 10px; }
    .pick-card {
      display: grid; gap: 4px; text-align: left; padding: 16px 18px;
      background: var(--glass);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      border: 1px solid var(--glass-line); border-radius: 18px;
      box-shadow: inset 0 1px 0 var(--glass-hi);
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s;
    }
    .pick-card:active { transform: scale(0.97); border-color: rgba(255, 201, 77, 0.45); }
    .pc-name { font-size: 1.1rem; font-weight: 800; }
    .pc-hint { font-size: 0.8rem; color: var(--dim); }
    .prof-note { display: grid; gap: 8px; }
    .prof-note .btn { min-height: 40px; }

    .conn-form { display: grid; gap: 10px; width: 100%; max-width: 340px; }
    .conn-form .note-input { margin-top: 0; }
    .conn-form .btn { min-height: 48px; }

    .pick-note { text-align: center; font-size: 0.78rem; color: var(--dim); }
    body.picking .tabbar, body.picking header { display: none; }

    /* ── Полка ───────────────────────── */
    .add-book { margin-bottom: 12px; }
    .add-form { display: grid; gap: 10px; }
    .add-form .note-input { margin-top: 0; }
    .ab-lab { display: grid; gap: 6px; font-size: 0.78rem; color: var(--muted); }
    .shelf { display: grid; gap: 12px; }
    .leaf {
      display: grid; grid-template-columns: 92px 1fr; gap: 14px;
      align-items: start; text-align: left; width: 100%;
      background: var(--glass);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      border: 1px solid var(--glass-line);
      border-radius: 18px; padding: 14px;
      box-shadow: inset 0 1px 0 var(--glass-hi);
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .leaf:active { transform: scale(0.98); }
    .shelf-cover {
      width: 92px; height: 124px; padding: 9px;
      transform: none; border-radius: 8px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .shelf-cover .cv-author { font-size: 0.44rem; letter-spacing: 0.1em; }
    .shelf-cover .cv-title { font-size: 0.6rem; line-height: 1.15; }
    .shelf-cover .wave { height: 30px; }
    .shelf-cover .keys { height: 26px; }
    .shelf-cover .smears { height: 26px; }
    .shelf-cover .cv-mark { font-size: 1.2rem; text-align: center; }

    .lf-body { display: grid; gap: 4px; min-width: 0; }
    .lf-title { font-size: 0.98rem; font-weight: 750; line-height: 1.2; }
    .lf-sub { font-size: 0.76rem; color: var(--dim); }
    .lf-when { font-size: 0.74rem; color: var(--muted); }
    .lf-meta { font-size: 0.74rem; color: var(--dim); }
    .lf-stars { font-size: 0.9rem; letter-spacing: 2px; color: var(--track); margin-top: 2px; }
    .lf-stars .on { color: var(--gold); }
    .lf-review {
      font-size: 0.8rem; color: var(--muted); line-height: 1.35; margin-top: 4px;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .lf-empty { font-size: 0.76rem; color: var(--dim); margin-top: 2px; }

    .shelf-sheet { display: grid; justify-items: center; gap: 10px; text-align: center; }
    .shelf-sheet .shelf-cover { width: 108px; height: 146px; }
    .shelf-sheet h3 { margin: 4px 0 0; font-size: 1.06rem; }
    .shelf-meta { margin: 0; color: var(--muted); font-size: 0.84rem; }
    .star-pick { display: flex; gap: 8px; font-size: 1.8rem; color: var(--track); cursor: pointer; }
    .star-pick .on { color: var(--gold); }
    .shelf-review { width: 100%; min-height: 92px; resize: none; }

    /* ── Настройки отдельным экраном ─── */
    .set-title { margin: 2px 0 14px; font-size: 1.25rem; font-weight: 800; }
    .set-list { display: grid; gap: 9px; }
    .set-row {
      display: grid; grid-template-columns: 42px 1fr 14px;
      align-items: center; gap: 12px; text-align: left; width: 100%;
      background: var(--glass);
      backdrop-filter: blur(16px) saturate(1.35);
      -webkit-backdrop-filter: blur(16px) saturate(1.35);
      border: 1px solid var(--glass-line);
      border-radius: 16px; padding: 12px 14px;
      box-shadow: inset 0 1px 0 var(--glass-hi);
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s;
    }
    .set-row:active { transform: scale(0.985); border-color: rgba(255, 201, 77, 0.4); }
    .set-ic {
      width: 42px; height: 42px; border-radius: 13px;
      display: grid; place-items: center; font-size: 1.15rem;
      background: var(--glass-2);
    }
    .set-txt { display: grid; gap: 2px; min-width: 0; }
    .set-txt b { font-size: 0.95rem; font-weight: 700; }
    .set-txt em {
      font-style: normal; font-size: 0.78rem; color: var(--dim);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .set-back { margin-top: 16px; }

    /* ── Мысли ───────────────────────── */
    .th-panel { display: grid; gap: 9px; }
    .th-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    .th-send { width: auto; padding: 0 20px; min-height: 44px; }
    /* оболочка своя, список системный — он лежит поверх и прозрачен */
    .th-select {
      position: relative;
      display: flex; align-items: center; gap: 8px;
      min-width: 0; min-height: 46px; padding: 0 12px;
      border-radius: 13px;
      background: var(--glass);
      border: 1px solid var(--glass-line);
      box-shadow: inset 0 1px 0 var(--glass-hi);
    }
    .th-select select {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      opacity: 0; -webkit-appearance: none; appearance: none;
      border: 0; background: none;
    }
    .ts-label {
      flex: 1; min-width: 0;
      font-size: 0.88rem; font-weight: 650; color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ts-arrow { color: var(--dim); font-size: 0.8rem; }
    .th-select:active { border-color: rgba(255, 201, 77, 0.45); }
    .th-at {
      display: grid; gap: 4px; justify-items: center;
      font-size: 0.7rem; color: var(--dim); white-space: nowrap;
    }
    .th-at .note-input { margin-top: 0; width: 78px; text-align: center; }
    .post.thought { display: grid; gap: 10px; }

    /* шапка мысли: маленькая обложка, название материала, дата и действия */
    .th-head {
      display: grid;
      grid-template-columns: auto 1fr auto;
      grid-template-areas: "cover name acts" "cover when acts";
      align-items: center;
      column-gap: 9px; row-gap: 0;
    }
    /* обложка обрезана до квадрата — так строка остаётся компактной */
    .th-cover {
      grid-area: cover;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 7px;
      overflow: hidden;
      background: var(--glass);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .th-cover img { height: 100%; width: 100%; object-fit: cover; display: block; }
    .th-cover i { font-style: normal; font-size: 1rem; }
    .th-name {
      grid-area: name; align-self: end;
      min-width: 0;
      font-size: 0.88rem; font-weight: 750; line-height: 1.25; color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .th-when { grid-area: when; align-self: start; font-size: 0.7rem; line-height: 1.25; color: var(--dim); }
    .th-acts { grid-area: acts; display: flex; align-items: center; gap: 2px; }
    .post.thought.editing .th-head { grid-template-areas: "cover name" "cover when"; grid-template-columns: auto 1fr; }

    .th-act { color: var(--dim); font-size: 0.95rem; padding: 4px 6px; }
    .th-act:active { color: var(--ink); }
    .th-act.like.on { color: #ff5f7e; }

    /* строка над лентой: что сейчас показано и как вытянуть случайную мысль */
    .th-hint {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      flex-wrap: wrap;
      margin: 10px 0 14px;
      font-size: 0.76rem; color: var(--dim); text-align: center;
    }
    /* внизу ленты остаётся место под плавающие кнопки */
    .notes-feed { padding-bottom: 52px; }
    .th-link {
      padding: 4px 10px; min-height: 30px;
      border-radius: 15px;
      background: var(--glass); border: 1px solid var(--glass-line);
      color: var(--ink); font-size: 0.76rem; font-weight: 650;
    }
    .post.thought.editing { border-color: rgba(255, 201, 77, 0.4); }
    .th-edit-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .th-edit-row .btn { min-height: 44px; }
    .th-form { display: grid; gap: 10px; }
    .th-lab { display: grid; gap: 6px; font-size: 0.78rem; color: var(--muted); }
    .th-lab .note-input { margin-top: 0; }
    .th-text { min-height: 84px; resize: none; margin-top: 0; }

    /* ── Магазин ─────────────────────── */
    .wallet { display: grid; gap: 8px; }
    .wal-sum { display: flex; align-items: baseline; gap: 9px; }
    .wal-sum b { font-size: 2rem; font-weight: 850; color: var(--gold); line-height: 1; }
    .wal-sum span { color: var(--muted); font-size: 0.9rem; }
    .wal-hint { font-size: 0.78rem; color: var(--dim); line-height: 1.4; }

    .shop-head {
      font-size: 0.72rem; font-weight: 800; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--dim);
      margin: 14px 2px 8px;
    }
    .theme-list { display: grid; gap: 9px; }
    .theme {
      display: grid; grid-template-columns: 52px 1fr auto;
      align-items: center; gap: 13px;
      background: var(--glass);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      border: 1px solid var(--glass-line);
      border-radius: 18px; padding: 12px 14px;
      box-shadow: inset 0 1px 0 var(--glass-hi);
    }
    .theme.on { border-color: rgba(255, 201, 77, 0.45); }
    .th-dots { display: flex; gap: -6px; width: 52px; height: 52px; position: relative; }
    .th-dots i {
      position: absolute; top: 11px; width: 26px; height: 26px; border-radius: 50%;
      border: 2px solid rgba(0, 0, 0, 0.35);
    }
    .th-dots i:nth-child(1) { left: 0; }
    .th-dots i:nth-child(2) { left: 13px; }
    .th-dots i:nth-child(3) { left: 26px; }
    .th-ic {
      width: 52px; height: 52px; border-radius: 16px;
      display: grid; place-items: center; font-size: 1.4rem;
      background: var(--glass-2);
    }
    .th-txt { display: grid; gap: 3px; min-width: 0; }
    .th-txt b { font-size: 0.93rem; font-weight: 700; }
    .th-txt em { font-style: normal; font-size: 0.76rem; color: var(--dim); line-height: 1.3; }
    .th-btn {
      min-height: 38px; padding: 0 14px; border-radius: 12px;
      font-size: 0.84rem; font-weight: 750; white-space: nowrap;
      background: var(--glass-2); color: var(--ink);
      border: 1px solid var(--glass-line);
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .th-btn:active { transform: scale(0.95); }
    .th-btn.buy { background: linear-gradient(140deg, var(--gold), var(--gold-2)); color: #241a05; border: 0; }
    .th-btn.buy.off { opacity: 0.42; }
    .th-tag { font-size: 0.76rem; color: var(--gold); font-weight: 700; }
    .pick-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .pick {
      display: inline-flex; align-items: center; gap: 8px;
      min-height: 40px; padding: 0 13px; border-radius: 12px;
      font-size: 0.83rem; font-weight: 650; color: var(--muted);
      background: var(--glass); border: 1px solid var(--glass-line);
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.2s, border-color 0.2s;
    }
    .pk-dots { display: inline-flex; }
    .pk-dots i {
      width: 12px; height: 12px; border-radius: 50%;
      border: 1.5px solid rgba(0, 0, 0, 0.35); margin-right: -5px;
    }
    .pk-name { white-space: nowrap; }
    .pick:active { transform: scale(0.95); }
    .pick.on { color: var(--ink); border-color: rgba(255, 201, 77, 0.5); background: var(--glass-2); }

    .shop-note { margin: 14px 4px 4px; font-size: 0.78rem; color: var(--dim); line-height: 1.45; }

    /* тихая перерисовка — без анимации появления, чтобы не дёргалось */
    #view.quiet > *, #view.quiet .hero > * { animation: none !important; }

    .to-top {
      position: fixed; right: 16px; z-index: 5;
      bottom: calc(var(--tab-h, 72px) + 14px);
      width: 44px; height: 44px; border-radius: 50%;
      display: grid; place-items: center;
      font-size: 1.1rem; color: var(--ink);
      background: var(--glass-2);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      border: 1px solid var(--glass-line);
      box-shadow: inset 0 1px 0 var(--glass-hi), 0 8px 22px var(--shadow);
      opacity: 0; transform: translateY(10px) scale(0.9);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .to-top.show { opacity: 1; transform: none; pointer-events: auto; }
    .to-top:active { transform: scale(0.92); }
    body.picking .to-top { display: none; }

    /* кнопки ленты мыслей — в углу, симметрично кнопке «наверх» */
    .fabs {
      position: fixed; left: 16px; z-index: 5;
      bottom: calc(var(--tab-h, 72px) + 14px);
      display: flex; align-items: center; gap: 8px;
      pointer-events: none;
    }
    .fab {
      min-width: 44px; height: 44px; padding: 0 13px;
      border-radius: 22px;
      /* скрытая кнопка не занимает место — иначе кубик уезжает от края */
      display: none; align-items: center; justify-content: center; gap: 6px;
      font-size: 0.86rem; font-weight: 700; color: var(--ink);
      background: var(--glass-2);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      border: 1px solid var(--glass-line);
      box-shadow: inset 0 1px 0 var(--glass-hi), 0 8px 22px var(--shadow);
      opacity: 0; transform: translateY(10px) scale(0.9);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .fab.show {
      display: flex;
      opacity: 1; transform: none; pointer-events: auto;
      animation: riseIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .fab:active { transform: scale(0.94); }
    .fab i { font-style: normal; font-size: 1.02rem; line-height: 1; }
    .like-fab i { color: #ff5f7e; }
    .like-fab.on { background: #ff5f7e; border-color: transparent; color: #2a0d13; }
    .like-fab.on i { color: #2a0d13; }
    .dice-fab { padding: 0; }
    body.picking .fabs { display: none; }

    /* ── Праздник ────────────────────── */
    .cheer {
      position: fixed; inset: 0;
      display: grid; place-items: center;
      background: rgba(5, 4, 10, 0.72);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      opacity: 0; pointer-events: none; transition: opacity 0.25s;
      z-index: 40;
    }
    .cheer.show { opacity: 1; pointer-events: auto; }
    .cheer-card { display: grid; justify-items: center; gap: 12px; text-align: center; padding: 24px; max-width: 340px; }

    /* мысль дня: откуда она, сам текст и сердечко */
    .cheer.daily .cheer-ic { background: linear-gradient(140deg, #b9a7ff, #8f7bff); }
    .cheer.daily #cheerText { display: grid; justify-items: center; gap: 12px; }
    .dt-src { display: flex; align-items: center; gap: 9px; }
    .dt-src-txt { display: grid; justify-items: start; gap: 1px; text-align: left; }
    .dt-src-txt b { font-size: 0.86rem; font-weight: 750; color: var(--ink); }
    .dt-src-txt em { font-style: normal; font-size: 0.72rem; color: var(--dim); }
    .dt-text {
      font-size: 0.98rem; line-height: 1.55; color: var(--ink);
      white-space: pre-wrap; text-align: left;
      max-height: 42vh; overflow-y: auto;
    }
    .dt-like.on { color: #ff5f7e; border-color: rgba(255, 95, 126, 0.5); }
    .cheer-ic {
      width: 108px; height: 108px; border-radius: 30px;
      background: linear-gradient(140deg, var(--gold), var(--gold-2));
      display: grid; place-items: center; font-size: 3.2rem;
      box-shadow: 0 10px 50px rgba(255, 180, 60, 0.45);
      animation: bump 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes bump { 0% { transform: scale(0.3); } 60% { transform: scale(1.1); } 100% { transform: scale(1); } }
    .cheer h2 { margin: 4px 0 0; font-size: 1.5rem; }
    .cheer p { margin: 0; color: var(--muted); line-height: 1.45; }

    /* кубик «чем заняться» */
    .gear.dice { font-size: 1.05rem; }
    .gear.dice:active { transform: scale(0.92); }

    .dice-sheet { display: grid; justify-items: center; gap: 14px; text-align: center; padding: 6px 0 2px; }
    .dice-face {
      width: 104px; height: 104px; border-radius: 28px;
      display: grid; place-items: center; font-size: 3rem;
      background: var(--card-2); border: 1px solid var(--line);
    }
    .dice-face.rolling { animation: shake 0.5s linear infinite; }
    @keyframes shake {
      0%, 100% { transform: rotate(-8deg) scale(1); }
      25% { transform: rotate(6deg) scale(1.06); }
      50% { transform: rotate(-4deg) scale(0.97); }
      75% { transform: rotate(9deg) scale(1.04); }
    }
    .dice-face.landed {
      background: linear-gradient(140deg, var(--gold), var(--gold-2));
      border: 0;
      box-shadow: 0 10px 34px rgba(255, 180, 60, 0.35);
      animation: bump 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .dice-what { font-size: 1.25rem; font-weight: 850; line-height: 1.2; }
    .dice-why { font-size: 0.9rem; color: var(--muted); line-height: 1.45; max-width: 300px; }
    .dice-why b { color: var(--gold); }

    /* уроки курса */
    .lessons { display: grid; gap: 7px; }
    .lesson {
      display: grid; grid-template-columns: 28px 1fr 22px;
      align-items: center; gap: 11px;
      background: var(--card-2); border: 1px solid var(--line);
      border-radius: 13px; padding: 10px 12px;
      text-align: left; width: 100%;
    }
    .lesson .ln {
      width: 26px; height: 26px; border-radius: 8px;
      background: var(--track); color: var(--muted);
      display: grid; place-items: center; font-size: 0.8rem; font-weight: 800;
    }
    .lesson .lt { font-size: 0.9rem; font-weight: 650; line-height: 1.25; }
    .lesson .lt i { display: block; font-style: normal; color: var(--dim); font-size: 0.76rem; font-weight: 500; margin-top: 2px; }
    .lesson .lc { color: var(--dim); font-size: 1rem; text-align: center; }
    .lesson.pick { border-color: rgba(255,201,77,0.6); background: rgba(255,201,77,0.1); }
    .lesson.pick .ln { background: linear-gradient(140deg, var(--gold), var(--gold-2)); color: #241a05; }
    .lesson.pick .lc { color: var(--gold); }
    .lesson.was { opacity: 0.62; }
    .lesson.was .lc { color: var(--green); }
    .lesson.was .ln { background: rgba(74,222,128,0.16); color: var(--green); }
    .lessons.flat .lesson { background: none; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 10px 2px; }
    .lessons.flat .lesson:first-child { border-top: 0; }
    .lesson-hint { margin-top: 11px; font-size: 0.85rem; color: var(--muted); text-align: center; }

    /* ══════════ ОБЗОР ══════════ */
    .level-panel { display: grid; gap: 14px; }
    .lv-row { display: flex; align-items: center; gap: 14px; }
    .lv-badge {
      width: 64px; height: 64px; flex: 0 0 auto; border-radius: 18px;
      background: linear-gradient(140deg, var(--gold), var(--gold-2)); color: #241a05;
      display: grid; place-items: center; align-content: center;
      box-shadow: 0 6px 22px rgba(255,175,60,0.32);
    }
    .lv-badge b { font-size: 1.7rem; font-weight: 850; line-height: 1; }
    .lv-badge span { font-size: 0.52rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; }
    .lv-info { flex: 1; min-width: 0; display: grid; gap: 6px; }
    .lv-xp { font-size: 0.92rem; color: var(--muted); }
    .lv-xp b { color: var(--ink); font-size: 1.15rem; font-weight: 850; }
    .lv-xp span { display: block; font-size: 0.76rem; color: var(--dim); }
    .lv-bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
    .lv-bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--gold), var(--gold-2)); transition: width 0.7s; }
    .lv-hint { font-size: 0.76rem; color: var(--dim); }

    .share { display: flex; gap: 3px; height: 12px; }
    .share i { border-radius: 3px; min-width: 3px; }
    .share-legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.78rem; color: var(--muted); }
    .share-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .share-legend i { width: 9px; height: 9px; border-radius: 3px; }

    .radar { width: 100%; max-width: 320px; margin: 0 auto; display: block; overflow: visible; }

    .modes {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 6px;
      background: var(--glass);
      border: 1px solid var(--glass-line);
      border-radius: 13px;
      padding: 4px;
      margin-bottom: 12px;
    }
    .mode {
      min-height: 36px;
      border-radius: 10px;
      font-size: 0.79rem;
      font-weight: 700;
      color: var(--muted);
    }
    .mode.on { background: rgba(255, 201, 77, 0.14); color: var(--gold); }

    .balance-hint {
      margin-top: 8px;
      font-size: 0.76rem;
      color: var(--dim);
      line-height: 1.45;
      text-align: center;
    }
    .balance-hint b { color: var(--muted); }

    .dir .dp.done { color: var(--green); }

    .balance-note {
      margin-top: 6px;
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.45;
      text-align: center;
    }
    .balance-note b { color: var(--ink); }

    .week-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .wd {
      display: grid; justify-items: center; gap: 4px;
      padding: 9px 0; border-radius: 11px;
      background: rgba(255,255,255,0.03); color: var(--dim);
      font-size: 0.7rem; font-weight: 700;
    }
    .wd i { font-style: normal; font-size: 0.9rem; }
    .wd.on { background: rgba(255,201,77,0.16); color: var(--gold); }

    .dirs { display: grid; gap: 2px; }
    .dir {
      display: grid; grid-template-columns: 26px 1fr auto;
      align-items: center; gap: 10px;
      padding: 10px 2px; border-top: 1px solid var(--line);
    }
    .dir:first-child { border-top: 0; }
    .dir .di { font-size: 1.1rem; text-align: center; }
    .dir .dn { font-size: 0.9rem; font-weight: 650; line-height: 1.2; }
    .dir .dn i { display: block; font-style: normal; font-size: 0.76rem; color: var(--dim); font-weight: 500; margin-top: 2px; }
    .dir .dp { font-weight: 850; color: var(--gold); }

    /* карточка награды в шторке */
    .ach-sheet { display: grid; justify-items: center; gap: 12px; text-align: center; padding: 4px 0 6px; }
    .ach-sheet .big {
      width: 96px; height: 96px; border-radius: 26px;
      display: grid; place-items: center; font-size: 2.9rem;
      background: var(--card-2); border: 1px solid var(--line);
    }
    .ach-sheet .big.open {
      background: linear-gradient(140deg, var(--gold), var(--gold-2));
      border: 0;
      box-shadow: 0 10px 34px rgba(255, 180, 60, 0.35);
    }
    .ach-sheet .big.hidden { filter: grayscale(1); opacity: 0.5; }
    .ach-sheet h3 { margin: 0; font-size: 1.3rem; }
    .ach-sheet .status {
      font-size: 0.72rem; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase;
      padding: 5px 12px; border-radius: 20px;
    }
    .ach-sheet .status.open { color: var(--green); background: rgba(74, 222, 128, 0.13); }
    .ach-sheet .status.wait { color: var(--muted); background: var(--glass); }
    .ach-sheet p { margin: 0; color: var(--muted); line-height: 1.5; font-size: 0.95rem; max-width: 320px; }
    .ach-sheet .cond {
      width: 100%;
      background: var(--card-2); border: 1px solid var(--line);
      border-radius: 13px; padding: 12px 14px;
      font-size: 0.88rem; color: var(--muted); text-align: left;
    }
    .ach-sheet .cond b { color: var(--ink); }

    .toast {
